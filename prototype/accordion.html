@property --tint { syntax: '<color>'; inherits: true; initial-value: #FFFFFF; }
/* Layout: 떠 있는 알약 헤더 아래 한 화면 무대. 플레이리스트 = 아코디언 파일, 바닥 경첩에서 앞으로 넘어간다.
   중립 무채색 UI + 글래스. 색과 그림은 파일(플레이리스트)만. 8px 라운드, 헤더만 완전히 둥글게. 토큰 원본은 DESIGN.md */
:root {
  color-scheme: light;

  --text-3: #767676;
  --line: rgba(0, 0, 0, .08);

  --fill-2: rgba(0, 0, 0, .08);
  --primary: #111111;
  --on-primary: #FFFFFF;
  --danger: #D93A3A;
  --glass: rgba(255, 255, 255, .24);
  --glass-thick: rgba(255, 255, 255, .64);
  --glass-edge: rgba(255, 255, 255, .5);
  --spec: rgba(255, 255, 255, .95);
  --glass-shade: 0 8px 24px rgba(0, 0, 0, .10), 0 1px 3px rgba(0, 0, 0, .06);
  --hbtn: rgba(255, 255, 255, .5);
  --dim: rgba(0, 0, 0, .16);
  --veil: rgba(255, 255, 255, .42);
  --knock: #FFFFFF;
  --tint: #FFFFFF;
  --rim-hi: color-mix(in oklab, var(--tint) 42%, white);
  --rim-mid: color-mix(in oklab, var(--tint) 40%, transparent);
  --rim-lo: color-mix(in oklab, var(--tint) 70%, white);
  --rim-edge: color-mix(in oklab, var(--tint) 50%, rgba(255, 255, 255, .4));
  --font: 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --hdr-top: calc(env(safe-area-inset-top, 0px) + 8px);
  --stage-top: calc(var(--hdr-top) + 56px + 12px);
  --bleed: 240px; /* 문서를 화면보다 위아래로 이만큼 길게: Safari 막대 뒤로 비칠 배경이 놓일 자리 */
  --edge: 10px; /* fixed 요소는 화면 위·아래 끝에서 이만큼 떨어뜨림 (닿으면 Safari가 막대를 한 색으로 칠함) */
}

  }
}

  color-scheme: dark;
  --bg: #000000; --text: #F5F5F5; --text-2: #ABABAB; --text-3: #8A8A8A;
  --line: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08); --fill-2: rgba(255, 255, 255, .12);
  --primary: #F5F5F5; --on-primary: #000000; --danger: #FF6B6B;
  --glass: rgba(44, 44, 48, .26); --glass-thick: rgba(28, 28, 30, .68); --glass-edge: rgba(255, 255, 255, .14);
  --spec: rgba(255, 255, 255, .5); --glass-shade: 0 8px 24px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .2); --hbtn: rgba(255, 255, 255, .12); --dim: rgba(0, 0, 0, .36); --veil: rgba(0, 0, 0, .45); --knock: #1C1C1E; --rim-hi: color-mix(in oklab, var(--tint) 62%, rgba(255, 255, 255, .7)); --rim-mid: color-mix(in oklab, var(--tint) 34%, transparent); --rim-lo: color-mix(in oklab, var(--tint) 75%, rgba(255, 255, 255, .25)); --rim-edge: color-mix(in oklab, var(--tint) 55%, rgba(255, 255, 255, .1));
}

*, *::before, *::after { box-sizing: border-box; }

/* ── 글자 (TDS T 스케일) ── */
.t-title-l { font-size: 26px; line-height: 35px; font-weight: 700; letter-spacing: -0.02em; }

/* ── 글래스 ── */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(6px) saturate(190%) brightness(1.04); backdrop-filter: blur(6px) saturate(190%) brightness(1.04); border: 0; box-shadow: var(--glass-shade), inset 0 0 0 0.5px var(--glass-edge); }
.glass.thick { background: var(--glass-thick); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); }
/* 반사광 테두리: 왼쪽 위가 밝고 오른쪽 아래로 옅어지는 0.75px 띠. 색은 뒤에 있는 것(--tint)을 머금음 */
.lg { position: relative; }
.lg { box-shadow: var(--glass-shade), inset 0 0 0 0.5px var(--rim-edge); }
.lg::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 0.75px; pointer-events: none; background: linear-gradient(140deg, var(--rim-hi), var(--rim-mid) 30%, transparent 55%, var(--rim-mid) 78%, var(--rim-lo)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }

/* ── Ambient: 멈춘 파일의 색·그림을 흐리게 깐 배경. 0.7초에 걸쳐 바뀜 ──
   iOS Safari 막대 뒤로 비치도록 fixed가 아니라 문서 안에, 화면 위아래 밖 140px까지 깔아요 */
.amb { position: absolute; left: 0; right: 0; top: calc(var(--bleed) - 140px); bottom: calc(var(--bleed) - 140px); z-index: 0; overflow: hidden; pointer-events: none; }
.amb-l { position: absolute; inset: -15%; opacity: 0; transition: opacity .7s ease; }

.amb-l canvas { filter: blur(28px) saturate(1.25); }
.amb::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
/* 레이어(화면 전체 fixed)가 열리면 Safari가 막대를 한 색으로 칠해요. 그때만 안 보이는(opacity 0) 띠로 그 색을 알려 줘요 */

.chrome-tint.top { top: 0; }
.chrome-tint.bot { bottom: 0; }
@keyframes drift { from { transform: scale(1.08) rotate(0deg); } to { transform: scale(1.28) rotate(9deg) translate(2%, -3%); } }

/* ── Header ── */
.edge { position: fixed; z-index: 35; left: 0; right: 0; top: 0; height: calc(var(--stage-top) + 4px); background: linear-gradient(var(--bg) 62%, color-mix(in srgb, var(--bg) 0%, transparent)); pointer-events: none; }
.hdr { position: fixed; z-index: 40; top: var(--hdr-top); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; }
.logo { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; margin-left: -4px; border: 0; background: none; cursor: pointer; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; border-radius: 8px; }
.logo svg { width: 28px; height: 28px; }
.hbtn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--hbtn); box-shadow: inset 0 0 0 0.5px var(--rim-edge); display: grid; place-items: center; cursor: pointer; }

/* ── Button · IconButton ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn.xl { height: 56px; padding: 0 20px; font-size: 17px; width: 100%; }
.btn.l { height: 48px; padding: 0 16px; font-size: 17px; }
.btn.m { height: 38px; padding: 0 14px; font-size: 15px; }
.btn.s { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.secondary { background: var(--fill); color: var(--text); }
.btn.ghost { background: transparent; color: var(--text); }
.btn.danger { background: var(--fill); color: var(--danger); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: default; }
.ibtn { display: inline-grid; place-items: center; flex: none; border: 0; border-radius: 8px; cursor: pointer; background: var(--fill); color: var(--text); }
.ibtn.m { width: 38px; height: 38px; }
.ibtn.s { width: 32px; height: 32px; }
.ibtn.ghost { background: transparent; }
.ibtn.danger { color: var(--danger); }
.on-cover { background: var(--oc, rgba(255, 255, 255, .24)); color: var(--on); box-shadow: inset 0 0 0 0.5px color-mix(in oklab, var(--tf, #FFFFFF) 50%, rgba(255, 255, 255, .35)); }
.btn.on-cover-primary { background: var(--on); color: var(--c); }

/* ── ActionBar ── */
.abar { display: flex; align-items: center; gap: 8px; }
.abar .grow { flex: 1; }
.like[aria-pressed="true"] .ic { color: inherit; }

/* ── 무대 (아코디언) ── */
.stage { position: fixed; inset: var(--edge) 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  -webkit-mask-image: linear-gradient(to bottom, transparent calc(env(safe-area-inset-top, 0px) - var(--edge)), #000 calc(var(--hdr-top) + 48px - var(--edge)), #000 calc(100% - 12px), transparent); mask-image: linear-gradient(to bottom, transparent calc(env(safe-area-inset-top, 0px) - var(--edge)), #000 calc(var(--hdr-top) + 48px - var(--edge)), #000 calc(100% - 12px), transparent); }
/* 파일 크기·위치를 재는 기준 칸: 헤더 아래 ~ 아래 여백 위 */
.stage-box { position: fixed; left: 0; right: 0; top: var(--stage-top); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); visibility: hidden; pointer-events: none; }
.stage.dragging { cursor: grabbing; }
.stage:focus-visible { outline: none; }

.file { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% var(--po, 0px); }
.foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--edge)); display: flex; justify-content: center; pointer-events: none; }
.pager { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; line-height: 19.5px; }
.pager .pos { font-weight: 600; }
.pager .hint { color: var(--text-2); }
.pager .hint.gone { display: none; }

/* ── File (아코디언 파일) ── */
.pocket { position: absolute; left: 50%; bottom: var(--hingeB, 16px); width: var(--W, 340px); height: var(--H, 460px); margin-left: calc(var(--W, 340px) / -2); transform-origin: 50% 100%; will-change: transform; }
.face { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; background: var(--c); color: var(--on); isolation: isolate; box-shadow: 0 14px 34px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .08); }
.face::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(158deg, color-mix(in oklab, var(--tf, #FFFFFF) 30%, rgba(255, 255, 255, .28)) 0%, color-mix(in oklab, var(--tf, #FFFFFF) 20%, rgba(255, 255, 255, .08)) 26%, transparent 48%, transparent 80%, color-mix(in oklab, var(--tf, #FFFFFF) 25%, rgba(255, 255, 255, .1)) 100%); }
.face .cv-img { position: absolute; inset: 0; background: var(--img) center / cover; }

.face .rim::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 0.75px; background: linear-gradient(150deg, color-mix(in oklab, var(--tf, #FFFFFF) 40%, white), color-mix(in oklab, var(--tf, #FFFFFF) 45%, transparent) 26%, transparent 50%, color-mix(in oklab, var(--tf, #FFFFFF) 35%, transparent) 76%, color-mix(in oklab, var(--tf, #FFFFFF) 70%, white)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.strip { position: relative; z-index: 2; height: 56px; padding: 12px 16px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.is-img .strip { background: rgba(0, 0, 0, .45); }
.strip .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .cnt { flex: none; font-size: 13px; font-weight: 600; opacity: .8; }
.pocketfront { position: absolute; left: 0; right: 0; bottom: 0; top: 56px; z-index: 2; padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, .1); box-shadow: inset 0 0.5px 0 color-mix(in oklab, var(--tf, #FFFFFF) 40%, rgba(255, 255, 255, .7)), inset 0 10px 18px -12px color-mix(in oklab, var(--tf, #FFFFFF) 35%, rgba(255, 255, 255, .35)), 0 -0.5px 0 rgba(0, 0, 0, .14); }
.is-img .pocketfront { background: none; overflow: hidden; isolation: isolate; }
.is-img .pocketfront::before { content: ""; position: absolute; inset: -20px; z-index: -1; background: var(--img) center / cover; filter: blur(16px) brightness(.6) saturate(1.2); }
.owner { padding: 0 4px; font-size: 15px; line-height: 22.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.owner span:last-child { font-weight: 400; opacity: .8; white-space: nowrap; }
.panel { position: relative; flex: 1; min-height: 0; border-radius: 8px; padding: 8px 12px 12px; display: flex; flex-direction: column; background: var(--pv); color: var(--on); box-shadow: inset 0 0 0 0.5px color-mix(in oklab, var(--tf, #FFFFFF) 50%, rgba(255, 255, 255, .35)); overflow: hidden; isolation: isolate; }
.is-img .panel::before { content: ""; position: absolute; inset: -24px; z-index: -1; background: var(--img) center / cover; filter: blur(18px) brightness(.5) saturate(1.2); }
.pv { flex: 1; min-height: 0; overflow: hidden; }
.pv li { display: flex; align-items: baseline; gap: 8px; height: 36px; padding-top: 6px; border-bottom: 1px solid color-mix(in srgb, var(--on) 16%, transparent); white-space: nowrap; }
.pv li:last-child { border-bottom: 0; }
.pv .n { flex: none; width: 18px; font-size: 13px; color: var(--on-2); }
.pv b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pv i { font-style: normal; font-size: 13px; color: var(--on-2); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.pv .by { flex: none; font-size: 13px; font-weight: 600; color: var(--on-2); }
.pv .more { font-size: 13px; color: var(--on-2); border: 0; height: 30px; }
.pv-empty { display: grid; place-items: center; height: 100%; font-size: 15px; color: var(--on-2); }
.panel .abar { padding-top: 8px; }
.shade { position: absolute; inset: 0; border-radius: 8px; background: #000; opacity: var(--shade, 0); pointer-events: none; z-index: 4; }
.pocket.is-back .pocketfront, .pocket.is-back .strip, .pocket.is-rear .pocketfront { visibility: hidden; }

.ed { font: inherit; color: inherit; letter-spacing: inherit; background: transparent; border: 0; margin: 0; padding: 0 2px; border-radius: 4px; outline: none; min-width: 0; box-shadow: inset 0 -1px 0 color-mix(in srgb, currentColor 45%, transparent); }
.ed:focus { background: color-mix(in srgb, currentColor 14%, transparent); box-shadow: inset 0 -2px 0 currentColor; }
.ttl-ed { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.ttl-in { flex: 1; width: 100%; min-width: 0; font-size: 20px; line-height: 29px; font-weight: 700; letter-spacing: -0.01em; }
.ic-ed { width: 16px; height: 16px; opacity: .7; }

/* ── 레이어 (상세 · 시트 · 다이얼로그) ── */
.layer { position: fixed; inset: 0; z-index: 50; }
.dim { position: absolute; inset: 0; background: var(--dim); }
.detail-wrap { position: absolute; inset: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; pointer-events: none; }
.detail { pointer-events: auto; width: min(100%, 480px); height: 100%; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; transform-origin: 0 0; }
.dcover { position: relative; flex: none; padding: 16px 16px 16px 20px; background: var(--c); color: var(--on); display: grid; gap: 4px; isolation: isolate; }
.dcover .cv-img { position: absolute; inset: 0; z-index: -1; background: var(--img) center / cover; }
.dcover.is-img::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0, 0, 0, .45); }
.dtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }

.dcover .abar { margin-top: 12px; }

.dhint { padding: 12px 12px 0; color: var(--text-3); }

/* ── SongRow ── */

.srow + .srow::before { content: ""; position: absolute; left: 64px; right: 12px; top: 0; border-top: 1px solid var(--line); }
.srow-main { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 12px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; }
.thumb { flex: none; width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; background: var(--fill-2); color: var(--text-3); }
.stxt { min-width: 0; display: grid; }
.stxt b { font-size: 17px; line-height: 25.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ssub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 15px; line-height: 22.5px; color: var(--text-2); }

function toHsl(hex) {

function pattern(kind) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 640
  const g = c.getContext('2d')
  if (kind === 'stripes') {
    g.fillStyle = '#F2C14E'; g.fillRect(0, 0, 480, 640)
    g.fillStyle = '#E4572E'
    for (let x = -640; x < 480; x += 90) { g.beginPath(); g.moveTo(x, 640); g.lineTo(x + 45, 640); g.lineTo(x + 685, 0); g.lineTo(x + 640, 0); g.closePath(); g.fill() }
  } else {
    g.fillStyle = '#EDE6DA'; g.fillRect(0, 0, 480, 640)
    const cols = ['#C9A27E', '#8DA399', '#D98C7A', '#5B6C8F']
    for (let i = 0; i < 14; i++) { g.fillStyle = cols[i % 4]; g.beginPath(); g.arc((i * 137) % 480, (i * 211) % 640, 40 + (i * 23) % 70, 0, Math.PI * 2); g.fill() }
  }
  try { return { v: c.toDataURL('image/jpeg', 0.85), tint: canvasTint(c) } } catch { return { v: '', tint: '#9A9A9A' } }
}

/* ════════ 소리 (0ddb584 그대로: WebAudio로 즉석 합성) ════════ */
let actx = null, noise = null, soundOn = store.get('sound', true), lastFlick = 0
function ac() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)()
      noise = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate)
      const d = noise.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
    } catch { actx = null }
  }
  if (actx?.state === 'suspended') actx.resume()
  return actx
}
function burst({ type = 'bandpass', freq = 2500, freqTo = null, q = 1, gain = 0.15, dur = 0.06, attack = 0.004 }) {
  const ctx = soundOn && actx && ac()
  if (!ctx) return
  const t = ctx.currentTime
  const src = ctx.createBufferSource(); src.buffer = noise
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q
  if (freqTo) fl.frequency.exponentialRampToValueAtTime(freqTo, t + dur)
  const g = ctx.createGain()
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  src.connect(fl).connect(g).connect(ctx.destination)
  src.start(t, Math.random() * 0.3, dur + 0.05)
}
function flick(strength = 1) {
  const now = performance.now()
  if (now - lastFlick < 26) return
  lastFlick = now
  burst({ freq: 1800 + Math.random() * 2200, q: 0.8, gain: 0.16 * strength, dur: 0.055 })
  try { navigator.vibrate?.(6) } catch { /* 진동 미지원 */ }
}

/* ════════ 배경: 멈춘 파일의 색·그림 (그림은 흐리게, 색은 Apple Music처럼 번진 색) ════════ */

  const c = document.createElement('canvas'); c.width = 90; c.height = 120

  if (route.cur === '') setTint(ambTint)

/* ════════ Safari 위·아래 막대 ════════

   그래서 문서를 화면보다 위아래로 --bleed만큼 길게 만들어 가운데에 세워 두고(손으로는 안 움직임), 배경을 그 밖까지 깔아요.
   레이어가 열렸을 때·Android(theme-color)·body 배경용으로는 화면 위·아래 가장자리에 보이는 색을 뽑아 둬요 */
const ctTop = $('#ct-top'), ctBot = $('#ct-bot')

function paintChrome() {

function goTo(i) { target = clamp(i, 0, N() - 1); kick() }

let down = null, samples = []
stage.addEventListener('pointerdown', (e) => {

  samples = [{ y: e.clientY, t: performance.now() }]

let wheelAcc = 0

const idxOf = (id) => PL.findIndex((p) => p.id === id)

/* ════════ 상세 (열린 파일) ════════ */
const dl = $('#dl'), detail = $('#detail')

      ${p.songs.length ? `<ol class="songs" id="d-songs">${p.songs.map((s, k) => C.songRow(s, k, 'feed')).join('')}</ol>` : '<p class="dhint t-body-s">아직 곡이 없어요. 첫 곡을 넣어 보세요.</p>'}

  $('.dbody', detail).scrollTop = y

}

      { transform: 'none', opacity: 1 },

/* ════════ 순서 바꾸기 (끌기 + 방향키) ════════ */
function enableReorder(list, getArr, done) {
  list.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('[data-grip]')
    if (!grip || e.button !== 0) return
    e.preventDefault()
    ac()
    const row = grip.closest('.srow'), rows = [...list.children], from = rows.indexOf(row)
    const h = row.offsetHeight, y0 = e.clientY
    let to = from
    row.classList.add('dragging')
    grip.setPointerCapture(e.pointerId)
    const move = (ev) => {
      const dy = ev.clientY - y0
      row.style.transform = `translateY(${dy}px)`
      const nt = clamp(from + Math.round(dy / h), 0, rows.length - 1)
      if (nt !== to) { to = nt; tick2() }
      rows.forEach((r, k) => { if (r === row) return; let s = 0; if (from < to && k > from && k <= to) s = -h; if (from > to && k < from && k >= to) s = h; r.style.transform = s ? `translateY(${s}px)` : ''; r.style.transition = RM ? '' : 'transform .18s ease-out' })
    }
    const up = () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up)
      rows.forEach((r) => { r.style.transform = ''; r.style.transition = '' })
      row.classList.remove('dragging')
      if (to !== from) { const arr = getArr(); arr.splice(to, 0, arr.splice(from, 1)[0]); done(); toast('순서를 바꿨어요') }
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up)
  })
  list.addEventListener('keydown', (e) => {
    const grip = e.target.closest('[data-grip]')
    if (!grip || !['ArrowUp', 'ArrowDown'].includes(e.key)) return
    e.preventDefault()
    const from = Number(grip.closest('.srow').dataset.k), arr = getArr(), to = clamp(from + (e.key === 'ArrowUp' ? -1 : 1), 0, arr.length - 1)
    if (to === from) return
    arr.splice(to, 0, arr.splice(from, 1)[0])
    done()
    document.querySelector(`.srow[data-k="${to}"] [data-grip]`)?.focus()
  })
}

/* ════════ 좋아요 · 공유 · 듣기 ════════ */
function toggleLike(id) {
  const p = byId(id)
  if (liked.has(id)) { liked.delete(id); p.likes-- } else { liked.add(id); p.likes++ ; tick2() }
  store.set('liked', [...liked])
  refreshFile(id)

}

const go = (h) => { if (location.hash.slice(1) === h) route(); else location.hash = h }

/* ════════ 이벤트 ════════ */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]')
  if (g) { const h = g.dataset.go; if (g.id === 'me-btn' && route.cur !== '') go(''); else go(h); return }
  const sg = e.target.closest('[data-seg]')
  if (sg) {
    const v = sg.dataset.v
    if (sg.dataset.seg === 'theme') { if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; store.set('theme', v); if (!pgComp.hidden) renderComp() }
    if (sg.dataset.seg === 'sound') { soundOn = v === 'on'; store.set('sound', soundOn); ac(); if (soundOn) flick() }
    if (sg.dataset.seg === 'cover-tab') { edTab = v; renderEdit(pgEdit.dataset.id); return }
    if (sg.dataset.seg === 'pen-size') { pad.size = Number(v); pad.erase = false; markPad() }
    sg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === sg)))
    return
  }
  const pen = e.target.closest('[data-pen]')
  if (pen) { pad.color = pen.dataset.pen; pad.erase = false; markPad(); return }
  const a = e.target.closest('[data-act]')
  if (!a) return
  const act = a.dataset.act
  if (act.startsWith('pad-')) { padAction(act, byId(pgEdit.dataset.id)); return }
  if (act === 'close-detail') closeDetail()
  else if (act === 'close-bs') closeBS()
  else if (act === 'close-dg') { dg.hidden = true; dgOk = null }
  else if (act === 'dg-ok') { dg.hidden = true; dgOk?.(); dgOk = null }
  else if (act === 'like') toggleLike(a.dataset.id)
  else if (act === 'share') share(a.dataset.id)
  else if (act === 'add') openAdd(a.dataset.id)
  else if (act === 'listen') openListen(Number(a.dataset.k))
  else if (act === 'owner-add') openAdd(pgEdit.dataset.id, { owner: true })
  else if (act === 'edit-song') openEditSong(pgEdit.dataset.id, Number(a.dataset.k))
  else if (act === 'del-song') { const p = byId(pgEdit.dataset.id), s = p.songs.splice(Number(a.dataset.k), 1)[0]; renderEdit(p.id); refreshFile(p.id); toast(`‘${s.t}’를 삭제했어요`) }
  else if (act === 'cover') { const p = byId(pgEdit.dataset.id); p.cover = { type: 'color', v: a.dataset.v }; renderEdit(p.id); refreshFile(p.id) }
  else if (act === 'del-pl') { const p = byId(pgEdit.dataset.id); confirmDlg({ title: '플레이리스트를 삭제할까요?', body: `‘${p.title}’과 곡 ${p.songs.length}개가 사라져요. 되돌릴 수 없어요.`, ok: '삭제', onOk: () => { PL.splice(idxOf(p.id), 1); build(); target = f = clamp(Math.round(f), 0, N() - 1); measure(); layout(performance.now()); posEl.textContent = `${Math.round(f) + 1} / ${N()}`; go('me'); toast('플레이리스트를 삭제했어요') } }) }
  else if (act === 'new-pl') { const used = new Set(PL.map((p) => p.cover.v)); const c = COLORS.find((x) => !used.has(x)) || COLORS[0]; const p = { id: 'p' + Date.now().toString(36), title: '새 플레이리스트', owner: myName, mine: true, cover: { type: 'color', v: c }, likes: 0, songs: [] }; PL.unshift(p); build(); f = target = 0; lastCell = 0; measure(); layout(performance.now()); posEl.textContent = `1 / ${N()}`; go(`edit-${p.id}`); toast('새 플레이리스트를 만들었어요') }
  else if (act === 'copy-manage') copyText(`${SHARE_BASE}#me`, '관리 링크를 복사했어요', null)
  else if (act === 'copy-link') copyText($('#sh-link').value, '링크를 복사했어요', $('#sh-link'))
  else if (act === 'native-share') { const l = $('#sh-link'); navigator.share({ title: 'Kanqaroo', text: l.dataset.text, url: l.value }).then(() => closeBS(), () => {}) }
  else if (act === 'ocr-manual') { const [id, o] = (bsheet.dataset.ocr || '').split('|'); if (id) openAdd(id, { owner: o === '1' }) }
  else if (act === 'go-comp') go('components')
  else if (act === 'reset-demo') confirmDlg({ title: '처음 상태로 되돌릴까요?', body: '이 기기에 저장된 플레이리스트·곡·순서·좋아요가 예시 데이터로 돌아가요. 이름과 화면 설정은 그대로예요.', ok: '되돌리기', onOk: resetDemo })
})
document.addEventListener('submit', (e) => { if (e.target.id === 'sf') { e.preventDefault(); bsSubmit?.() } })
document.addEventListener('paste', (e) => {
  if (bs.hidden || !bsheet.dataset.ocr) return
  const f0 = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/'))
  if (!f0) return
  e.preventDefault()
  const [id, o] = bsheet.dataset.ocr.split('|')
  startOcr(id, o === '1', f0)
})
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (!dg.hidden) { dg.hidden = true; dgOk = null } else if (!bs.hidden) closeBS()
  else if (openId) closeDetail()
  else if (route.cur) go('')
})
window.addEventListener('hashchange', route)
window.addEventListener('resize', () => { measure(); layout(performance.now()) })

{ const BLEED = 240 // CSS --bleed와 같게
  const typing = () => document.activeElement?.matches('input, textarea, [contenteditable]')
  const pin = () => { if (!typing() && Math.abs(scrollY - BLEED) > 0.5) scrollTo(0, BLEED) }
  try { history.scrollRestoration = 'manual' } catch { /* 지원 안 함 */ }
  pin(); addEventListener('load', pin); addEventListener('resize', pin); addEventListener('scroll', pin, { passive: true })
  document.addEventListener('focusout', () => setTimeout(pin, 300)) // 키보드가 내려간 뒤 제자리로
  window.visualViewport?.addEventListener('resize', () => setTimeout(pin, 100)) }
{ const mo = new MutationObserver(() => paintChrome())
  for (const el of [dl, bs, dg, pgMe, pgEdit, pgComp]) mo.observe(el, { attributes: true, attributeFilter: ['hidden'] })
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintChrome)
  let rt = 0
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (ambSrc) sampleEdges(ambSrc.src, ambSrc.cover) }, 200) }) }

/* ════════ 시작 ════════ */
measure()
build()
posEl.textContent = `1 / ${N()}`
introStart = performance.now()
layout(introStart)
setAmbient(PL[0])
kick()
booted = true
if (location.hash) route()
</script>
