<style>
/* Layout: 떠 있는 알약 헤더 아래 한 화면 무대. 플레이리스트 = 아코디언 파일, 바닥 경첩에서 앞으로 넘어간다.

let actx = null, noise = null, soundOn = store.get('sound', true), lastFlick = 0
function ac() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)()
      noise = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate)
      const d = noise.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1

  }

  return actx
}
function burst({ type = 'bandpass', freq = 2500, freqTo = null, q = 1, gain = 0.15, dur = 0.06, attack = 0.004 }) {
  const ctx = soundOn && actx && ac()
  if (!ctx) return
  const t = ctx.currentTime
  const src = ctx.createBufferSource(); src.buffer = noise
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q
  if (freqTo) fl.frequency.exponentialRampToValueAtTime(freqTo, t + dur)
  const g = ctx.createGain()
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  src.connect(fl).connect(g).connect(ctx.destination)
  src.start(t, Math.random() * 0.3, dur + 0.05)
}
function flick(strength = 1) {
  const now = performance.now()
  if (now - lastFlick < 26) return
  lastFlick = now
  burst({ freq: 1800 + Math.random() * 2200, q: 0.8, gain: 0.16 * strength, dur: 0.055 })
  try { navigator.vibrate?.(6) } catch { /* 진동 미지원 */ }
}
const swish = (back = false) => burst({ freq: back ? 2600 : 700, freqTo: back ? 700 : 2600, q: 0.6, gain: 0.08, dur: 0.24, attack: 0.05 })
const tick2 = () => burst({ freq: 3200, q: 2, gain: 0.08, dur: 0.03 })

/* ════════ 피드 · 아코디언 ════════ */
const stage = $('#stage'), file = $('#file'), hint = $('#hint'), posEl = $('#pos')
let POCKETS = []
const N = () => PL.length
function renderPocket(i) {
  const p = POCKETS[i]
  p.innerHTML = C.face(PL[i], { rows: G.rows }) + '<div class="shade"></div>'
  p._back = p._focus = undefined
}
function build() {
  file.innerHTML = ''
  POCKETS = PL.map((pl, i) => { const el = document.createElement('div'); el.className = 'pocket'; el.dataset.i = i; file.append(el); return el })
  POCKETS.forEach((_, i) => renderPocket(i))
  bumps = new Array(N()).fill(0)
}

let f = 0, vel = 0, target = 0, dragging = false, raf = 0, last = 0, lastCell = 0, flips = 0
let introStart = 0, introDone = RM, bumps = []
let openId = null
const STRIP = 44, VIS = 4
let G = { sh: 640, W: 340, H: 460, step: 70, rows: 5 }
function measure() {
  const r = stage.getBoundingClientRect()
  const W = Math.min(r.width - 40, 420)
  const hinge = Math.max(12, r.height * 0.03)
  const H = Math.max(300, Math.min(r.height - hinge - STRIP * VIS - 4, W * 1.5))
  const rows = clamp(Math.floor((H - 56 - 12 - 22.5 - 12 - 20 - 46 - 12) / 36), 2, 7)
  const changed = rows !== G.rows
  G = { sh: r.height, W, H, step: clamp(r.height * 0.1, 54, 88), rows }
  file.style.setProperty('--W', `${W}px`)
  file.style.setProperty('--H', `${H}px`)
  file.style.setProperty('--hingeB', `${hinge}px`)
  if (changed && POCKETS.length) POCKETS.forEach((_, i) => renderPocket(i))
}
const FLAT = -84
function pose(d) {
  let rot, ty, tz, shade, op = 1
  if (d >= 0) {
    const k = Math.min(d, VIS + 1)
    rot = 2 + k * 1.6; ty = -k * STRIP; tz = -k * 22; shade = Math.min(0.45, k * 0.08)
    if (d > VIS) op = Math.max(0, VIS + 1 - d)
  } else if (d > -1) {
    const t = ease(-d)
    rot = 2 + (FLAT - 2) * t; ty = 8 * t; tz = 20 * t; shade = 0.3 * t
  } else {
    const k = Math.min(-d - 1, 6)
    rot = FLAT - k * 1.2; ty = 8 + k * 5; tz = 20 + k * 3; shade = 0.36 + k * 0.03
    if (-d > 6) op = Math.max(0, 7 + d)
  }
  return { rot, ty, tz, shade, op }
}

  const cell = Math.round(f)
  const settled = Math.abs(f - cell) < 0.18 && introDone
  let busy = false
  for (let i = 0; i < N(); i++) {
    const el = POCKETS[i]
    const d = i - f
    const p = pose(d)
    let e = 1
    if (!introDone) { e = clamp((now - introStart - i * 55) / 460, 0, 1); if (e < 1) busy = true; e = backOut(e) }
    const b = bumps[i] || 0
    const rot = p.rot * e - b * 5
    const ty = p.ty * e + (1 - e) * G.sh * 0.75 + b * 6
    el.style.transform = `translate3d(0,${ty.toFixed(2)}px,${(p.tz * e).toFixed(2)}px) rotateX(${rot.toFixed(2)}deg)`
    el.style.opacity = p.op
    el.style.visibility = p.op < 0.01 ? 'hidden' : ''
    el.style.setProperty('--shade', p.shade.toFixed(3))
    el.style.zIndex = d >= 0 ? 500 - Math.round(d * 10) : 600 + i
    const back = rot < -70
    if (el._back !== back) { el._back = back; el.classList.toggle('is-back', back) }

    if (el._focus !== focus) { el._focus = focus; el.classList.toggle('is-focus', focus); el.setAttribute('aria-hidden', String(!focus)) }

}

  const n = Math.abs(cell - lastCell)

  for (let k = 0; k < Math.min(n, 4); k++) setTimeout(() => flick(0.8 + Math.random() * 0.4), k * 24)

}
function tick(t) {

    if (RM) { f = target; vel = 0 }
    else {
      vel += ((target - f) * 230 - vel * 27) * dt
      f += vel * dt
      if (Math.abs(target - f) < 0.0008 && Math.abs(vel) < 0.003) { f = target; vel = 0 }
    }
  }

let down = null, samples = []
stage.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || openId) return
  ac()
  down = { x: e.clientX, y: e.clientY, f0: f, moved: false }

})
stage.addEventListener('pointermove', (e) => {

  if (!down.moved && Math.hypot(dy, e.clientX - down.x) > 6) { down.moved = true; dragging = true; stage.classList.add('dragging'); vel = 0 }
  if (!dragging) return
  let nf = down.f0 - dy / G.step
  if (nf < 0) nf *= 0.35
  if (nf > N() - 1) nf = N() - 1 + (nf - (N() - 1)) * 0.35
  f = nf

})

  down = null

  stage.classList.remove('dragging')
  const a = samples[0], b = samples[samples.length - 1]
  const dt = Math.max(0.016, (b.t - a.t) / 1000)

function tap(x, y) {

  const i = Number(pocket.dataset.i)
  const front = i === Math.round(target) && Math.abs(f - target) < 0.08
  if (!front) { goTo(i); return }
  const fa = el.closest('[data-fa]')?.dataset.fa
  if (fa === 'like') toggleLike(PL[i].id)
  else if (fa === 'share') share(PL[i].id)
  else if (fa === 'add') openAdd(PL[i].id)

let wheelAcc = 0
stage.addEventListener('wheel', (e) => {

stage.addEventListener('keydown', (e) => {

const idxOf = (id) => PL.findIndex((p) => p.id === id)

/* ════════ 순서 바꾸기 (끌기 + 방향키) ════════ */
function enableReorder(list, getArr, done) {
  list.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('[data-grip]')
    if (!grip || e.button !== 0) return
    e.preventDefault()
    ac()
    const row = grip.closest('.srow'), rows = [...list.children], from = rows.indexOf(row)
    const h = row.offsetHeight, y0 = e.clientY
    let to = from
    row.classList.add('dragging')
    grip.setPointerCapture(e.pointerId)
    const move = (ev) => {
      const dy = ev.clientY - y0
      row.style.transform = `translateY(${dy}px)`
      const nt = clamp(from + Math.round(dy / h), 0, rows.length - 1)
      if (nt !== to) { to = nt; tick2() }
      rows.forEach((r, k) => { if (r === row) return; let s = 0; if (from < to && k > from && k <= to) s = -h; if (from > to && k < from && k >= to) s = h; r.style.transform = s ? `translateY(${s}px)` : ''; r.style.transition = RM ? '' : 'transform .18s ease-out' })
    }
    const up = () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up)
      rows.forEach((r) => { r.style.transform = ''; r.style.transition = '' })
      row.classList.remove('dragging')
      if (to !== from) { const arr = getArr(); arr.splice(to, 0, arr.splice(from, 1)[0]); done(); toast('순서를 바꿨어요') }
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up)
  })
  list.addEventListener('keydown', (e) => {
    const grip = e.target.closest('[data-grip]')
    if (!grip || !['ArrowUp', 'ArrowDown'].includes(e.key)) return
    e.preventDefault()
    const from = Number(grip.closest('.srow').dataset.k), arr = getArr(), to = clamp(from + (e.key === 'ArrowUp' ? -1 : 1), 0, arr.length - 1)
    if (to === from) return
    arr.splice(to, 0, arr.splice(from, 1)[0])
    done()
    document.querySelector(`.srow[data-k="${to}"] [data-grip]`)?.focus()
  })
}

  closeBS()
  pgMe.hidden = h !== 'me'
  pgEdit.hidden = !h.startsWith('edit-')
  pgComp.hidden = h !== 'components'
  $('#me-btn').setAttribute('aria-pressed', String(h !== ''))
  if (h === 'me') renderMe()
  else if (h.startsWith('edit-')) renderEdit(h.slice(5))
  else if (h === 'components') renderComp()
  else stage.focus({ preventScroll: true })
  ;[pgMe, pgEdit, pgComp].forEach((pg) => { if (!pg.hidden) pg.scrollTop = 0 })
}
route.cur = ''
const go = (h) => { if (location.hash.slice(1) === h) route(); else location.hash = h }

/* ════════ 이벤트 ════════ */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]')
  if (g) { const h = g.dataset.go; if (g.id === 'me-btn' && route.cur !== '') go(''); else go(h); return }
  const sg = e.target.closest('[data-seg]')
  if (sg) {
    const v = sg.dataset.v
    if (sg.dataset.seg === 'theme') { if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; if (!pgComp.hidden) renderComp() }
    if (sg.dataset.seg === 'sound') { soundOn = v === 'on'; store.set('sound', soundOn); ac(); if (soundOn) flick() }
    sg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === sg)))
    return
  }
  const a = e.target.closest('[data-act]')
  if (!a) return
  const act = a.dataset.act
  if (act === 'close-detail') closeDetail()
  else if (act === 'close-bs') closeBS()
  else if (act === 'close-dg') { dg.hidden = true; dgOk = null }
  else if (act === 'dg-ok') { dg.hidden = true; dgOk?.(); dgOk = null }
  else if (act === 'like') toggleLike(a.dataset.id)
  else if (act === 'share') share(a.dataset.id)
  else if (act === 'add') openAdd(a.dataset.id)
  else if (act === 'listen') openListen(Number(a.dataset.k))
  else if (act === 'owner-add') openAdd(pgEdit.dataset.id, { owner: true })
  else if (act === 'edit-song') openEditSong(pgEdit.dataset.id, Number(a.dataset.k))
  else if (act === 'del-song') { const p = byId(pgEdit.dataset.id), s = p.songs.splice(Number(a.dataset.k), 1)[0]; renderEdit(p.id); refreshFile(p.id); toast(`‘${s.t}’를 삭제했어요`) }
  else if (act === 'cover') { const p = byId(pgEdit.dataset.id); p.cover = { type: 'color', v: a.dataset.v }; renderEdit(p.id); refreshFile(p.id) }
  else if (act === 'del-pl') { const p = byId(pgEdit.dataset.id); confirmDlg({ title: '플레이리스트를 삭제할까요?', body: `‘${p.title}’과 곡 ${p.songs.length}개가 사라져요. 되돌릴 수 없어요.`, ok: '삭제', onOk: () => { PL.splice(idxOf(p.id), 1); build(); target = f = clamp(Math.round(f), 0, N() - 1); measure(); layout(performance.now()); posEl.textContent = `${Math.round(f) + 1} / ${N()}`; go('me'); toast('플레이리스트를 삭제했어요') } }) }
  else if (act === 'new-pl') { const used = new Set(PL.map((p) => p.cover.v)); const c = COLORS.find((x) => !used.has(x)) || COLORS[0]; const p = { id: 'p' + Date.now().toString(36), title: '새 플레이리스트', owner: myName, mine: true, cover: { type: 'color', v: c }, likes: 0, songs: [] }; PL.unshift(p); build(); f = target = 0; lastCell = 0; measure(); layout(performance.now()); posEl.textContent = `1 / ${N()}`; go(`edit-${p.id}`); toast('새 플레이리스트를 만들었어요') }
  else if (act === 'copy-manage') { const link = 'https://example.com/kanqaroo/manage/예시'; try { navigator.clipboard.writeText(link).then(() => toast('관리 링크를 복사했어요'), () => toast(`관리 링크: ${link}`)) } catch { toast(`관리 링크: ${link}`) } }
  else if (act === 'go-comp') go('components')
})
document.addEventListener('submit', (e) => { if (e.target.id === 'sf') { e.preventDefault(); bsSubmit?.() } })
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (!dg.hidden) { dg.hidden = true; dgOk = null } else if (!bs.hidden) closeBS()
  else if (openId) closeDetail()
  else if (route.cur) go('')
})
window.addEventListener('hashchange', route)
window.addEventListener('resize', () => { measure(); layout(performance.now()) })

/* ════════ 시작 ════════ */
measure()
build()
posEl.textContent = `1 / ${N()}`
introStart = performance.now()
layout(introStart)
kick()
if (location.hash) route()
</script>
