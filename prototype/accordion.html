<title>Kanqaroo 아코디언 파일철</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 한 화면 무대. 아코디언 파일철을 살짝 위에서 내려다봄. 칸막이(플레이리스트)가 바닥 경첩에서 앞으로 넘어간다.
   흑백 단색, Pretendard 하나, 각진 모서리. 라이트 단일 테마로 고정 */
:root {
  color-scheme: light;
  --bg: #e8e8e8;
  --ink: #111111;
  --ink-2: #555555;
  --ink-3: #8c8c8c;
  --white: #ffffff;
  --divider: #f0f0f0;
  --edge: 2px solid var(--ink);
  --font: 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
@font-face { font-family: 'Pretendard'; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,__FONT_400__) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 600; font-display: swap; src: url(data:font/woff2;base64,__FONT_600__) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 700; font-display: swap; src: url(data:font/woff2;base64,__FONT_700__) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; font-display: swap; src: url(data:font/woff2;base64,__FONT_800__) format('woff2'); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); word-break: keep-all; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; }
.mark { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.count { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip { height: 32px; padding: 0 12px; border: 1.5px solid var(--ink); background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip:hover { background: var(--ink); color: var(--white); }
.chip[aria-pressed="false"] { color: var(--ink-3); border-color: var(--ink-3); }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.file { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 0%; }
.hint { position: absolute; left: 0; right: 0; bottom: 2.5%; margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink-2); pointer-events: none; transition: opacity .4s; }
.hint.gone { opacity: 0; }

/* ── 칸막이(포켓) ── */
.pocket { position: absolute; left: 50%; bottom: var(--hingeB, 10%); width: var(--W, 340px); height: var(--H, 440px); margin-left: calc(var(--W, 340px) / -2); transform-origin: 50% 100%; will-change: transform; }
.pocket > .back { position: absolute; inset: 0; background: var(--divider); border: var(--edge); }
.tab { position: absolute; top: -32px; height: 34px; width: 38%; padding: 0 12px; display: flex; align-items: center; background: var(--divider); border: var(--edge); border-bottom: 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
.tab span { overflow: hidden; text-overflow: ellipsis; }
.paper { position: absolute; left: 6%; right: 6%; top: 4.5%; bottom: 6%; padding: 10px 12px; background: var(--white); border: 1.5px solid var(--ink); font-size: 13px; line-height: 1.8; overflow: hidden; }
.paper p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper b { color: var(--ink-3); font-weight: 700; margin-right: 6px; }
.peeks { position: absolute; left: 6%; right: 6%; top: calc(22% - 26px); height: 60px; }
.peek { position: absolute; top: var(--lift); width: 31%; height: 50px; padding: 6px 9px; background: var(--ink); color: var(--white); font-size: 14px; font-weight: 700; line-height: 1.2; transform: rotate(var(--r)); white-space: nowrap; overflow: hidden; }
.peek.fresh { animation: peekpop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes peekpop { from { transform: translateY(26px) rotate(var(--r)); } }
.front { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; background: var(--white); border: var(--edge); }
.front::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 1.5px solid var(--ink); }
.label { position: absolute; top: 18%; left: 8%; right: 8%; }
.l-title { margin: 0; font-size: clamp(26px, 9vw, 40px); font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; text-wrap: balance; }
.l-who { margin: 10px 0 0; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.l-meta { margin: 2px 0 0; font-size: 14px; color: var(--ink-3); }
.front-hint { position: absolute; left: 8%; bottom: 7%; margin: 0; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s; }
.pocket.is-focus .front-hint { opacity: 1; }
.shade { position: absolute; inset: -32px 0 0 0; background: #000; opacity: var(--shade, 0); pointer-events: none; }
.pocket.is-back .paper, .pocket.is-back .peeks, .pocket.is-back .front, .pocket.is-back .tab span { visibility: hidden; }
.pocket.pulled .paper, .pocket.pulled .peeks { visibility: hidden; }

/* ── 꺼낸 시트 ── */
.layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.backdrop { position: absolute; inset: 0; background: rgb(17 17 17 / .55); }
.card { position: relative; width: min(100%, 460px); max-height: 100%; display: flex; flex-direction: column; background: var(--white); color: var(--ink); border: var(--edge); transform-origin: 0 0; overflow: hidden; }
.card-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 14px 18px; background: var(--ink); color: var(--white); }
.card-title { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; min-width: 0; }
.put-back { flex: none; height: 34px; padding: 0 12px; border: 1.5px solid var(--white); background: transparent; font-size: 13px; font-weight: 700; cursor: pointer; }
.put-back:hover { background: var(--white); color: var(--ink); }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px 8px; overscroll-behavior: contain; }
.card-who { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); }
.lines { margin: 0; padding: 0; list-style: none; }
.lines li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--ink); }
.lines li:last-child { border-bottom: 0; }
.lines .n { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.lines .s b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines .s i { display: block; font-style: normal; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines li.slip { margin: 6px -8px; padding: 11px 12px; border-bottom: 0; background: var(--ink); color: var(--white); transform: rotate(var(--r)); }
.lines li.slip .n, .lines li.slip .s i { color: rgb(255 255 255 / .62); }
.lines .who { font-size: 13px; font-weight: 700; white-space: nowrap; }
.card-foot { flex: none; padding: 10px 18px 18px; }
.add { width: 100%; height: 50px; border: 0; background: var(--ink); color: var(--white); font-size: 17px; font-weight: 800; cursor: pointer; }
.slip-form { flex: none; margin: 0 16px 16px; padding: 14px; background: var(--ink); color: var(--white); transform: rotate(-0.8deg); display: grid; gap: 4px; }
.slip-form .form-h { margin: 0 0 4px; font-size: 15px; font-weight: 800; }
.slip-form input { width: 100%; height: 42px; padding: 0 2px; border: 0; border-bottom: 1.5px solid rgb(255 255 255 / .45); background: transparent; color: var(--white); font-size: 17px; font-weight: 600; outline: none; }
.slip-form input::placeholder { color: rgb(255 255 255 / .45); }
.slip-form input:focus { border-bottom-color: var(--white); }
.sf-err { min-height: 18px; margin: 4px 0 0; font-size: 13px; font-weight: 700; }
.sf-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 4px; }
.sf-row button { height: 44px; padding: 0 16px; font-weight: 800; cursor: pointer; }
.sf-cancel { border: 1.5px solid var(--white); background: transparent; color: var(--white); }
.sf-go { border: 0; background: var(--white); color: var(--ink); font-size: 16px; }

.flyer { position: fixed; left: 0; top: 0; z-index: 60; width: 168px; height: 92px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; background: var(--ink); color: var(--white); pointer-events: none; }
.flyer b { font-size: 17px; font-weight: 800; line-height: 1.15; overflow: hidden; }
.flyer span { font-size: 13px; font-weight: 700; text-align: right; }
.pop { position: fixed; z-index: 61; margin: 0; font-size: 30px; font-weight: 800; color: var(--ink); pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .hint, .front-hint { transition: none; }
  .peek.fresh { animation: none; }
}
</style>

<div class="app">
  <header class="bar">
    <span class="mark">kanqaroo</span>
    <span class="count" id="count" aria-live="polite">01 / 10</span>
    <button class="chip" id="sound" aria-pressed="true">소리 켬</button>
  </header>
  <div class="stage" id="stage" role="application" aria-label="플레이리스트 파일철. 위아래로 넘기고, 누르면 꺼내 봐요. 방향키와 Enter도 돼요" tabindex="0">
    <div class="file" id="file"></div>
    <p class="hint" id="hint">↑ 위로 쓸어 넘기고, 누르면 꺼내 봐요</p>
  </div>
</div>
<div class="layer" id="layer" hidden>
  <div class="backdrop" id="backdrop" data-act="close-sheet"></div>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title"></article>
</div>

<script>
'use strict'
/* ════════ 데이터 (예시) ════════ */
const NOW = Date.now(), MIN = 60e3, HOUR = 60 * MIN
const S = (t, a, by = null, ago = 0) => ({ t, a, by, at: NOW - ago })
const LISTS = [
  { title: '새벽 운전', owner: '지우', songs: [S('Nights', 'Frank Ocean'), S('Kyoto', 'Phoebe Bridgers', '민지', 2 * HOUR), S('Square (2017)', '백예린'), S('Antifreeze', '검정치마'), S('Plastic Love', '竹内まりや', '민준', 20 * MIN), S('Space Song', 'Beach House'), S('밤편지', '아이유')] },
  { title: '첫 자취방', owner: '준호', songs: [S('별일 없이 산다', '장기하와 얼굴들'), S('위잉위잉', '혁오'), S('난춘', '새소년', '민지', 40 * MIN), S('NO PAIN', '실리카겔'), S('주저하는 연인들을 위해', '잔나비')] },
  { title: '헬스장 금지곡', owner: '도윤', songs: [S('Lose Yourself', 'Eminem'), S('Stronger', 'Kanye West'), S('Numb', 'Linkin Park'), S('말달리자', '크라잉넛', '서준', 5 * HOUR), S('낭만고양이', '체리필터', '유나', 3 * HOUR), S('고백 (Go Back)', '다이나믹 듀오')] },
  { title: '비 오는 날 작업용', owner: '민지', songs: [S('No Surprises', 'Radiohead'), S('Weird Fishes/Arpeggi', 'Radiohead'), S('Chamber of Reflection', 'Mac DeMarco', '하늘', 9 * HOUR), S('기억을 걷는 시간', '넬'), S('바람이 분다', '이소라'), S('산책', '백예린', '지우', 5 * HOUR)] },
  { title: '출근길 30분', owner: '서연', songs: [S('Blinding Lights', 'The Weeknd'), S('Hype Boy', 'NewJeans'), S('우주를 줄게', '볼빨간사춘기'), S('Yellow', 'Coldplay', '도윤', 30 * HOUR), S('봄이 좋냐??', '10cm')] },
  { title: '여름 끝물', owner: '하늘', songs: [S('Maria También', 'Khruangbin'), S('The Less I Know The Better', 'Tame Impala'), S('TOMBOY', '혁오'), S('Ditto', 'NewJeans', '서연', 50 * HOUR), S('Get Lucky', 'Daft Punk')] },
  { title: '이별 후 3일차', owner: '유나', songs: [S('너의 모든 순간', '성시경'), S('모든 날, 모든 순간', '폴킴', '지우', 7 * HOUR), S('Someone Like You', 'Adele'), S('서른 즈음에', '김광석'), S('Paris in the Rain', 'Lauv', '민준', HOUR)] },
  { title: '노래방 18번', owner: '서준', songs: [S('가시', '버즈'), S('Tears', '소찬휘', '수아', 2 * HOUR), S('하하하쏭', '자우림'), S('해변의 여인', '쿨'), S('소녀시대', '이승철', '도윤', 12 * HOUR)] },
  { title: '고양이랑 낮잠', owner: '수아', songs: [S("Don't Know Why", 'Norah Jones'), S('My Funny Valentine', 'Chet Baker'), S('공드리', '혁오', '유나', 4 * HOUR), S('무릎', '아이유')] },
  { title: '시험 기간', owner: '지호', songs: [S('Aruarian Dance', 'Nujabes'), S('Summer', '久石譲'), S('사건의 지평선', '윤하', '서준', 6 * HOUR), S('Fix You', 'Coldplay')] },
]
const N = LISTS.length
function hash(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) | 0; return Math.abs(h) }
const slipTilt = (s) => ((hash(s.t + s.by) % 5) - 2) * 0.5

/* ════════ 유틸 ════════ */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches
const $ = (s, r = document) => r.querySelector(s)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const pad = (n) => String(n).padStart(2, '0')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2)
const backOut = (t) => { const c = 1.5; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2 }

/* ════════ 소리 (WebAudio로 즉석 합성, 첫 터치 뒤부터) ════════ */
let actx = null, noise = null, soundOn = true, lastFlick = 0
function ac() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)()
      noise = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate)
      const d = noise.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
    } catch { actx = null }
  }
  if (actx?.state === 'suspended') actx.resume()
  return actx
}
function burst({ type = 'bandpass', freq = 2500, freqTo = null, q = 1, gain = 0.15, dur = 0.06, attack = 0.004 }) {
  const ctx = soundOn && actx && ac()
  if (!ctx) return
  const t = ctx.currentTime
  const src = ctx.createBufferSource(); src.buffer = noise
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q
  if (freqTo) fl.frequency.exponentialRampToValueAtTime(freqTo, t + dur)
  const g = ctx.createGain()
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  src.connect(fl).connect(g).connect(ctx.destination)
  src.start(t, Math.random() * 0.3, dur + 0.05)
}
function tone(f0, f1, dur, gain, type = 'sine') {
  const ctx = soundOn && actx && ac()
  if (!ctx) return
  const t = ctx.currentTime
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur)
  const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02)
}
function flick(strength = 1) {
  const now = performance.now()
  if (now - lastFlick < 26) return
  lastFlick = now
  burst({ freq: 1800 + Math.random() * 2200, q: 0.8, gain: 0.16 * strength, dur: 0.055 })
  try { navigator.vibrate?.(6) } catch { /* 진동 미지원 */ }
}
const thud = () => { burst({ type: 'lowpass', freq: 520, q: 0.7, gain: 0.35, dur: 0.14 }); tone(130, 62, 0.16, 0.22) }
const swish = (back = false) => burst({ freq: back ? 2600 : 700, freqTo: back ? 700 : 2600, q: 0.6, gain: 0.08, dur: 0.24, attack: 0.05 })

/* ════════ 무대 만들기 ════════ */
const stage = $('#stage'), file = $('#file'), hint = $('#hint'), countEl = $('#count')
const POCKETS = []
function pocketInner(l, i, freshLast = false) {
  const slips = l.songs.filter((s) => s.by)
  const shown = slips.slice(-3)
  const peeks = shown.map((s, k) => `<span class="peek${freshLast && k === shown.length - 1 ? ' fresh' : ''}" style="left:${3 + k * 34}%;--r:${[-3, 2, -1.5][k]}deg;--lift:${[0, 7, 3][k]}px">${esc(s.by)}</span>`).join('')
  const lines = l.songs.slice(0, 3).map((s, k) => `<p><b>${pad(k + 1)}</b>${esc(s.t)} — ${esc(s.a)}</p>`).join('')
  return `<div class="back"></div>
    <div class="tab" style="left:${(i % 4) * 20.6}%"><span>${esc(l.title)}</span></div>
    <div class="paper">${lines}</div>
    <div class="peeks">${peeks}</div>
    <div class="front"><div class="label"><p class="l-title">${esc(l.title)}</p><p class="l-who">${esc(l.owner)}님의 플레이리스트</p><p class="l-meta">${l.songs.length}곡 · 쪽지 ${slips.length}장</p></div><p class="front-hint">눌러서 꺼내기 →</p></div>
    <div class="shade"></div>`
}
function build() {
  LISTS.forEach((l, i) => {
    const p = document.createElement('div')
    p.className = 'pocket'
    p.dataset.i = i
    p.innerHTML = pocketInner(l, i)
    file.append(p)
    POCKETS.push(p)
  })
}

/* ════════ 상태 · 물리 ════════ */
let f = 0, vel = 0, target = 0
let dragging = false, raf = 0, last = 0
let lastCell = 0, flips = 0
let introStart = 0, introDone = RM
const bumps = new Array(N).fill(0)
let openIdx = null, myName = ''
let G = { sw: 360, sh: 640, W: 340, H: 440, step: 70 }

function measure() {
  const r = stage.getBoundingClientRect()
  const W = Math.min(r.width - 6, 540)
  const H = Math.min(r.height * 0.7, W * 1.38, 680)
  G = { sw: r.width, sh: r.height, W, H, step: clamp(r.height * 0.1, 54, 88) }
  file.style.setProperty('--W', `${W}px`)
  file.style.setProperty('--H', `${H}px`)
  file.style.setProperty('--hingeB', `${r.height * 0.09}px`)
}

/* d = 칸 번호 − 지금 보는 위치. 0이면 똑바로 선 칸, 양수는 뒤에 기대 선 칸, 음수는 앞으로 넘어간 칸 */
const FLAT = -84
function pose(d) {
  let rot, ty, tz, shade, op = 1
  if (d >= 0) {
    const k = Math.min(d, 9)
    rot = 3 + k * 1.3; ty = -k * 16; tz = -k * 34; shade = Math.min(0.5, k * 0.065)
    if (d > 8) op = Math.max(0, 9 - d)
  } else if (d > -1) {
    const t = ease(-d)
    rot = 3 + (FLAT - 3) * t; ty = 8 * t; tz = 20 * t; shade = 0.34 * t
  } else {
    const k = Math.min(-d - 1, 6)
    rot = FLAT - k * 1.2; ty = 8 + k * 5; tz = 20 + k * 3; shade = 0.4 + k * 0.03
    if (-d > 6) op = Math.max(0, 7 + d)
  }
  return { rot, ty, tz, shade, op }
}
function layout(now) {
  const cell = Math.round(f)
  const settled = Math.abs(f - cell) < 0.18 && introDone
  let introBusy = false
  for (let i = 0; i < N; i++) {
    const el = POCKETS[i]
    const d = i - f
    const p = pose(d)
    // 처음 열 때: 앞 칸부터 차례로 아래에서 주르륵 올라옴
    let e = 1
    if (!introDone) {
      e = clamp((now - introStart - i * 55) / 460, 0, 1)
      if (e < 1) introBusy = true
      e = backOut(e)
    }
    const b = bumps[i]
    const rot = p.rot * e - b * 5
    const ty = p.ty * e + (1 - e) * G.sh * 0.75 + b * 6
    const tz = p.tz * e
    el.style.transform = `translate3d(0,${ty.toFixed(2)}px,${tz.toFixed(2)}px) rotateX(${rot.toFixed(2)}deg)`
    el.style.opacity = p.op
    el.style.visibility = p.op < 0.01 ? 'hidden' : ''
    el.style.setProperty('--shade', p.shade.toFixed(3))
    el.style.zIndex = d >= 0 ? 500 - Math.round(d * 10) : 600 + i
    const back = rot < -70
    if (el._back !== back) { el._back = back; el.classList.toggle('is-back', back) }
    const focus = settled && i === cell
    if (el._focus !== focus) { el._focus = focus; el.classList.toggle('is-focus', focus) }
  }
  if (!introDone && !introBusy && introStart) introDone = true
}
function crossing() {
  const cell = clamp(Math.round(f), 0, N - 1)
  if (cell === lastCell) return
  const n = Math.abs(cell - lastCell)
  lastCell = cell
  for (let k = 0; k < Math.min(n, 4); k++) setTimeout(() => flick(0.8 + Math.random() * 0.4), k * 24)
  countEl.textContent = `${pad(cell + 1)} / ${pad(N)}`
  flips += n
  if (flips >= 3) hint.classList.add('gone')
}
function tick(t) {
  raf = 0
  if (!introStart) introStart = t
  const dt = last ? Math.min(0.033, (t - last) / 1000) : 0.016
  last = t
  if (!dragging) {
    if (RM) { f = target; vel = 0 }
    else {
      vel += ((target - f) * 230 - vel * 27) * dt
      f += vel * dt
      if (Math.abs(target - f) < 0.0008 && Math.abs(vel) < 0.003) { f = target; vel = 0 }
    }
  }
  for (let i = 0; i < N; i++) if (bumps[i]) { bumps[i] *= Math.exp(-dt * 7); if (bumps[i] < 0.002) bumps[i] = 0 }
  crossing()
  layout(t)
  if (dragging || f !== target || !introDone || bumps.some(Boolean)) kick()
  else last = 0
}
function kick() { if (!raf) raf = requestAnimationFrame(tick) }
function goTo(i) { target = clamp(i, 0, N - 1); kick() }

/* 끌어서 넘기기 */
let down = null, samples = []
stage.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || openIdx != null) return
  ac()
  down = { x: e.clientX, y: e.clientY, f0: f, moved: false }
  samples = [{ y: e.clientY, t: performance.now() }]
  stage.setPointerCapture(e.pointerId)
})
stage.addEventListener('pointermove', (e) => {
  if (!down) return
  const dy = e.clientY - down.y
  if (!down.moved && Math.hypot(dy, e.clientX - down.x) > 6) { down.moved = true; dragging = true; stage.classList.add('dragging'); vel = 0 }
  if (!dragging) return
  let nf = down.f0 - dy / G.step
  if (nf < 0) nf *= 0.35
  if (nf > N - 1) nf = N - 1 + (nf - (N - 1)) * 0.35
  f = nf
  const now = performance.now()
  samples.push({ y: e.clientY, t: now })
  while (samples.length > 2 && now - samples[0].t > 110) samples.shift()
  kick()
})
function endDrag(e, cancelled) {
  if (!down) return
  const d = down
  down = null
  if (!d.moved) { if (!cancelled) tap(e.clientX, e.clientY); return }
  dragging = false
  stage.classList.remove('dragging')
  const a = samples[0], b = samples[samples.length - 1]
  const dt = Math.max(0.016, (b.t - a.t) / 1000)
  vel = clamp(-((b.y - a.y) / dt) / G.step, -40, 40)
  target = clamp(Math.round(f + vel * 0.17), 0, N - 1)
  kick()
}
stage.addEventListener('pointerup', (e) => endDrag(e, false))
stage.addEventListener('pointercancel', (e) => endDrag(e, true))
function tap(x, y) {
  const pocket = document.elementFromPoint(x, y)?.closest('.pocket[data-i]')
  if (!pocket) return
  const i = Number(pocket.dataset.i)
  if (i === Math.round(target) && Math.abs(f - target) < 0.08) openSheet(i)
  else goTo(i)
}

/* 휠 · 키보드 */
let wheelAcc = 0
stage.addEventListener('wheel', (e) => {
  e.preventDefault()
  if (openIdx != null) return
  wheelAcc += e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY
  while (Math.abs(wheelAcc) >= 55) {
    const s = Math.sign(wheelAcc)
    target = clamp(target + s, 0, N - 1)
    wheelAcc -= s * 55
  }
  kick()
}, { passive: false })
window.addEventListener('keydown', (e) => {
  if (openIdx != null) {
    if (e.key === 'Escape') { e.preventDefault(); if (!$('#slip-form')?.hidden) toggleForm(false); else closeSheet() }
    return
  }
  if (e.target.closest?.('input, button')) return
  if (['ArrowDown', 'ArrowRight', 'j', 'PageDown'].includes(e.key)) { e.preventDefault(); goTo(target + 1) }
  else if (['ArrowUp', 'ArrowLeft', 'k', 'PageUp'].includes(e.key)) { e.preventDefault(); goTo(target - 1) }
  else if (e.key === 'Enter') { e.preventDefault(); if (Math.abs(f - target) < 0.08) openSheet(Math.round(target)) }
})

/* ════════ 꺼낸 시트 ════════ */
const layer = $('#layer'), card = $('#card'), backdrop = $('#backdrop')
function cardHTML(l) {
  const slips = l.songs.filter((s) => s.by).length
  return `<div class="card-head"><h2 class="card-title" id="card-title">${esc(l.title)}</h2><button class="put-back" data-act="close-sheet">다시 꽂기</button></div>
    <div class="card-body">
      <p class="card-who">${esc(l.owner)}님의 플레이리스트 · ${l.songs.length}곡 · 쪽지 ${slips}장</p>
      <ol class="lines">${l.songs.map((s, i) => s.by
        ? `<li class="slip" style="--r:${slipTilt(s)}deg"><span class="n">${pad(i + 1)}</span><span class="s"><b>${esc(s.t)}</b><i>${esc(s.a)}</i></span><span class="who">${esc(s.by)}님이 넣음</span></li>`
        : `<li><span class="n">${pad(i + 1)}</span><span class="s"><b>${esc(s.t)}</b><i>${esc(s.a)}</i></span><span></span></li>`).join('')}</ol>
    </div>
    <div class="card-foot" id="card-foot"><button class="add" data-act="slip-form">쪽지 넣기</button></div>
    <form class="slip-form" id="slip-form" novalidate hidden>
      <p class="form-h">쪽지에 적어 주세요</p>
      <input id="sf-title" placeholder="노래 제목" maxlength="60" autocomplete="off" aria-label="노래 제목">
      <input id="sf-artist" placeholder="가수" maxlength="40" autocomplete="off" aria-label="가수">
      <input id="sf-name" placeholder="내 이름" maxlength="10" autocomplete="off" aria-label="내 이름" value="${esc(myName)}">
      <p class="sf-err" id="sf-err" role="alert"></p>
      <div class="sf-row"><button type="button" class="sf-cancel" data-act="slip-cancel">그만두기</button><button type="submit" class="sf-go">쏙 넣기</button></div>
    </form>`
}
function openSheet(i) {
  if (openIdx != null) return
  openIdx = i
  card.innerHTML = cardHTML(LISTS[i])
  layer.hidden = false
  const p = POCKETS[i]
  const from = p.querySelector('.paper').getBoundingClientRect()
  p.classList.add('pulled')
  swish()
  if (!RM) {
    const to = card.getBoundingClientRect()
    card.animate([
      { transform: `translate(${from.left - to.left}px,${from.top - to.top}px) scale(${from.width / to.width},${from.height / to.height})` },
      { transform: 'translate(0,-10px) scale(1.01)', offset: 0.75 },
      { transform: 'none' },
    ], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' })
    backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 })
  }
  $('.put-back', card).focus({ preventScroll: true })
}
function closeSheet(after) {
  if (openIdx == null) { after?.(); return }
  const p = POCKETS[openIdx]
  const finish = () => {
    card.getAnimations().forEach((a) => a.cancel())
    backdrop.getAnimations().forEach((a) => a.cancel())
    layer.hidden = true
    card.innerHTML = ''
    p.classList.remove('pulled')
    openIdx = null
    stage.focus({ preventScroll: true })
    after?.()
  }
  if (RM) { finish(); return }
  const to = p.querySelector('.paper').getBoundingClientRect()
  const from = card.getBoundingClientRect()
  swish(true)
  card.animate([
    { transform: 'none' },
    { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(${to.width / from.width},${to.height / from.height})` },
  ], { duration: 360, easing: 'cubic-bezier(.55,0,.75,.2)', fill: 'forwards' }).finished.then(finish, finish)
  backdrop.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, fill: 'forwards' })
}
function toggleForm(on) {
  const form = $('#slip-form'), foot = $('#card-foot')
  form.hidden = !on
  foot.hidden = on
  if (on) {
    $('#sf-err').textContent = ''
    $('#sf-title').focus({ preventScroll: true })
    form.scrollIntoView({ block: 'nearest' })
    if (!RM) form.animate([{ transform: 'translateY(40px) rotate(3deg)', opacity: 0 }, { transform: 'rotate(-0.8deg)', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.3,1.4,.5,1)' })
  } else $('.add', card)?.focus({ preventScroll: true })
}
function submitSlip() {
  const title = $('#sf-title').value.trim()
  const artist = $('#sf-artist').value.trim()
  const name = $('#sf-name').value.trim().replace(/님$/, '')
  const err = !title ? '노래 제목을 적어 주세요' : !name ? '이름을 적어 주세요. 주인에게 ‘○○님이 넣음’으로 보여요' : ''
  if (err) { $('#sf-err').textContent = err; return }
  const i = openIdx
  const from = $('#slip-form').getBoundingClientRect()
  myName = name
  LISTS[i].songs.push(S(title, artist || '모르는 가수', name))
  closeSheet(() => flySlip(from, i, title, name))
}
function flySlip(from, i, title, name) {
  const p = POCKETS[i]
  const arrive = () => {
    thud()
    bumps[i] = 1
    p.innerHTML = pocketInner(LISTS[i], i, true)
    kick()
    const fr = p.querySelector('.front').getBoundingClientRect()
    const pop = document.createElement('p')
    pop.className = 'pop'
    pop.textContent = '쏙!'
    pop.style.left = `${fr.left + fr.width / 2 - 22}px`
    pop.style.top = `${fr.top - 70}px`
    document.body.append(pop)
    if (RM) setTimeout(() => pop.remove(), 600)
    else pop.animate([{ transform: 'translateY(10px) scale(.6)', opacity: 0 }, { transform: 'translateY(-8px) scale(1.1)', opacity: 1, offset: 0.35 }, { transform: 'translateY(-26px) scale(1)', opacity: 0 }], { duration: 900, easing: 'ease-out' }).finished.then(() => pop.remove())
  }
  if (RM) { arrive(); return }
  const fr = p.querySelector('.front').getBoundingClientRect()
  const w = 168, h = 92
  const x0 = from.left + from.width / 2 - w / 2, y0 = from.top + from.height / 2 - h / 2
  const x1 = fr.left + fr.width / 2 - w / 2, y1 = fr.top - h * 0.62
  const fl = document.createElement('div')
  fl.className = 'flyer'
  fl.innerHTML = `<b>${esc(title)}</b><span>${esc(name)}</span>`
  document.body.append(fl)
  fl.animate([
    { transform: `translate(${x0}px,${y0}px) rotate(-4deg) scale(1)` },
    { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 90}px) rotate(12deg) scale(.82)`, offset: 0.45 },
    { transform: `translate(${x1}px,${y1}px) rotate(-3deg) scale(.6)`, offset: 0.8 },
    { transform: `translate(${x1}px,${y1 + 50}px) rotate(0deg) scale(.55)`, opacity: 0 },
  ], { duration: 820, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' }).finished.then(() => fl.remove())
  setTimeout(arrive, 650)
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]')
  if (!a) return
  const act = a.dataset.act
  if (act === 'close-sheet') closeSheet()
  else if (act === 'slip-form') toggleForm(true)
  else if (act === 'slip-cancel') toggleForm(false)
})
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'slip-form') return
  e.preventDefault()
  submitSlip()
})
$('#sound').addEventListener('click', (e) => {
  ac()
  soundOn = !soundOn
  e.currentTarget.setAttribute('aria-pressed', String(soundOn))
  e.currentTarget.textContent = soundOn ? '소리 켬' : '소리 끔'
  if (soundOn) flick()
})
window.addEventListener('resize', () => { measure(); layout(performance.now()) })

build()
measure()
introStart = performance.now()
layout(introStart)
kick()
</script>
