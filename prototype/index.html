<meta name="description" content="친구들이 한 곡씩 몰래 넣어 같이 완성하는 블라인드 플레이리스트">
<title>Kanqaroo</title>
<style>
@font-face { font-family: 'Pretendard'; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,__FONT_400__) format('woff2'); }

/* ── 토큰: UI는 무채색, 색은 주머니(플레이리스트)만. 그라데이션 없음 ── */
:root {
  color-scheme: light;
  --bg: #F3F1EC; --paper: #FFFFFF; --line: #E2DFD8; --text: #161513; --text-2: #5E5B55; --text-3: #8F8B83;

  --c: #FF6B35; --on-c: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #121211; --paper: #1E1D1B; --line: #33312D; --text: #F3F1EC; --text-2: #B3AFA6; --text-3: #85817A; --ink: #F3F1EC; --on-ink: #121211; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 var(--font); word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 6px) 20px calc(env(safe-area-inset-bottom, 0px) + 48px); }
.top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
.logo { border: 0; background: none; padding: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; cursor: pointer; }
.ibtn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; font-size: 17px; }
.ibtn[aria-pressed="false"] { opacity: .5; }
.stack { display: grid; gap: 16px; }
h1 { margin: 0; font-size: 28px; line-height: 1.28; letter-spacing: -0.025em; font-weight: 800; }
h2 { margin: 0; font-size: 19px; line-height: 1.35; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--text-2); font-size: 15px; }
.tiny { color: var(--text-3); font-size: 13px; }
.center { text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: var(--r); border: 0; background: var(--paper); box-shadow: var(--shadow); font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s; }
.btn:active { transform: scale(.97); }
.btn.ink { background: var(--ink); color: var(--on-ink); }
.btn.colored { background: var(--c); color: var(--on-c); }
.btn.ghost { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.btn.sm { height: 40px; padding: 0 14px; font-size: 15px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1 1 0; }
.panel { background: var(--paper); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }

/* ══ 주머니: 뒷면 + 카드 + 앞주머니. 카드는 입구 위로 살짝만 보임 ══ */
.pouch { position: relative; width: min(300px, 78vw); aspect-ratio: 1; margin: 0 auto; cursor: pointer; touch-action: manipulation; transform-origin: 50% 90%; user-select: none; -webkit-user-select: none; }
.pouch.sm { width: 100%; cursor: inherit; }
.p-back { position: absolute; inset: 10% 4% 0; border-radius: 22% 22% 26% 26% / 18% 18% 30% 30%; background: color-mix(in oklab, var(--c) 72%, #000); }
.p-cards { position: absolute; inset: 0; z-index: 0; }
.card { position: absolute; width: 19%; aspect-ratio: 3 / 4; border-radius: 5px; background: #FFFDF8; box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .18); transform-origin: 50% 100%; }
.card::before { content: ""; position: absolute; left: 50%; top: 20%; width: 34%; aspect-ratio: 1; margin-left: -17%; border-radius: 50%; background: var(--c); }
.card::after { content: ""; position: absolute; left: 18%; right: 18%; top: 58%; height: 2px; border-radius: 2px; background: #E8E2D6; box-shadow: 0 6px 0 #E8E2D6; }
.card.mine::before { box-shadow: 0 0 0 3px #FFFDF8, 0 0 0 5px var(--c); }
.p-front { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 64%; width: 100%; overflow: visible; }
.p-front .body { fill: var(--c); }
.p-front .stitch { fill: none; stroke: var(--on-c); stroke-opacity: .55; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
.p-tag { position: absolute; z-index: 2; left: 0; right: 0; bottom: 14%; text-align: center; color: var(--on-c); font-weight: 800; font-size: clamp(28px, 11vw, 44px); letter-spacing: -0.03em; line-height: 1; pointer-events: none; }
.p-tag small { font-size: .45em; opacity: .75; font-weight: 700; letter-spacing: 0; }
.pouch.sm .p-tag { font-size: 22px; }
/* 개봉 테이프 */
.tape { position: absolute; z-index: 3; left: -2%; right: -2%; top: 47%; height: 13%; transform: rotate(-4deg); pointer-events: none; }
.tape-strip { position: absolute; inset: 0; background: var(--ink); clip-path: inset(0 0 0 var(--torn, 0%)); display: flex; align-items: center; justify-content: center; color: var(--on-ink); font-weight: 800; font-size: 13px; letter-spacing: .18em; }
.tape-strip::before, .tape-strip::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: radial-gradient(circle, var(--bg) 1.2px, transparent 1.6px) 0 0 / 8px 3px repeat-x; }
.tape-strip::before { top: -1px; } .tape-strip::after { bottom: -1px; }
.tab { position: absolute; top: 50%; left: var(--tab, 0%); width: 52px; height: 52px; margin: -26px 0 0 -10px; border-radius: 999px; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; pointer-events: auto; touch-action: none; cursor: grab; border: 0; }

/* ══ 카드 쓰기: 앞면(적기) → 뒤집으면 봉인된 뒷면 → 위로 밀어 주머니에 ══ */
.flip { perspective: 1200px; touch-action: pan-y; }
.flip-in { position: relative; display: grid; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); }
.flip.sealed .flip-in { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; background: #FFFDF8; color: #161513; box-shadow: var(--shadow); overflow: hidden; }
.face.back { transform: rotateY(180deg); display: grid; place-items: center; align-content: center; gap: 10px; min-height: 100%; touch-action: none; cursor: grab; }
.face.back .seal { width: 64px; height: 64px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-weight: 800; font-size: 22px; }
.face.back p { color: #5E5B55; font-size: 15px; font-weight: 600; }
.face.back .up { font-size: 28px; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-8px); } }
.band { background: var(--c); color: var(--on-c); padding: 12px 18px; display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
.lines { padding: 6px 18px 18px; display: grid; }
.lines label { display: grid; padding-top: 12px; font-size: 12px; font-weight: 700; color: #8F8B83; letter-spacing: .04em; }
.lines input { border: 0; border-bottom: 1.5px dashed #D9D3C7; background: none; height: 40px; font-size: 18px; font-weight: 600; color: #161513; padding: 0; border-radius: 0; }
.lines input:focus { outline: none; border-bottom: 1.5px solid var(--c); }
.lines .btn { margin-top: 18px; }

.postcard { background: #FFFDF8; color: #161513; border-radius: 10px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; box-shadow: var(--shadow); transform: rotate(-1.2deg); }
.postcard pre { margin: 0; font: 600 15px/1.55 var(--font); white-space: pre-wrap; word-break: break-all; }
.stamp { width: 54px; height: 64px; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-weight: 800; font-size: 12px; text-align: center; line-height: 1.2; outline: 3px dotted #FFFDF8; outline-offset: -5px; }

/* 개봉한 카드 목록 */
.opened { display: grid; gap: 10px; perspective: 1000px; }
.ocard { background: #FFFDF8; color: #161513; border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center; box-shadow: var(--shadow); transform-origin: 50% 0; }
.ocard .n { grid-row: span 2; font-size: 22px; font-weight: 800; color: var(--c); text-align: center; }
.ocard .t { font-weight: 700; line-height: 1.3; }
.ocard .a { font-size: 14px; color: #5E5B55; grid-column: 2; }
.ocard .by { grid-row: span 2; grid-column: 3; font-size: 12px; font-weight: 700; color: var(--on-c); background: var(--c); padding: 3px 9px; border-radius: 999px; }
.ocard .listen { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 6px; }
.ocard .listen a { font-size: 12px; font-weight: 600; color: #5E5B55; text-decoration: none; padding: 3px 9px; border-radius: 999px; box-shadow: inset 0 0 0 1px #E2DFD8; }

.swatches { display: flex; gap: 10px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--s); cursor: pointer; box-shadow: var(--shadow); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.field { display: grid; gap: 6px; font-size: 14px; font-weight: 700; color: var(--text-2); }
.field input[type="text"] { height: 50px; padding: 0 14px; border-radius: var(--r); border: 0; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); font-size: 17px; font-weight: 600; color: var(--text); }
.field input[type="text"]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper output { min-width: 2.5ch; text-align: center; font-size: 26px; font-weight: 800; color: var(--text); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }

.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini a { text-decoration: none; background: var(--paper); border-radius: 12px; padding: 12px 12px 14px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.mini .ttl { font-size: 14px; font-weight: 700; line-height: 1.35; }
.mini .st { font-size: 12px; color: var(--text-3); font-weight: 600; }
.demo { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 8px; }
.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; max-width: calc(100% - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fly { position: fixed; z-index: 8; pointer-events: none; }
</style>

<div class="wrap">
  <header class="top"><button class="logo" data-go="" aria-label="kanqaroo 처음으로">kanqaroo</button><button class="ibtn" id="snd" aria-label="소리" aria-pressed="true">♪</button></header>
  <main id="view" class="stack"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s)
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

/* ════════ 저장 (데모: 서버 없이 이 기기 localStorage) ════════ */
const store = {
  get(k, d) { try { const v = localStorage.getItem('kq2.' + k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem('kq2.' + k, JSON.stringify(v)) } catch { /* 저장 못 함 */ } },
}
const uid = (n = 6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('')
const COLORS = [['#FF6B35', '#FFFFFF'], ['#3D6BFF', '#FFFFFF'], ['#1E9E63', '#FFFFFF'], ['#F5B700', '#1A1405'], ['#E8457C', '#FFFFFF'], ['#7A5BFF', '#FFFFFF']]
let rooms = store.get('rooms', null)
const me = store.get('me', {})   // 방마다 { name, idx, seen }
const own = store.get('own', {}) // 방마다 만든 사람 열쇠
const save = () => { store.set('rooms', rooms); store.set('me', me); store.set('own', own) }
if (!rooms) {
  const seed = [['Hikaru Nara', 'Goose house', '민지'], ['Antifreeze', '검정치마', '도윤'], ['Plastic Love', '竹内まりや', '서연'], ['Nights', 'Frank Ocean', '하준'], ['Square (2017)', '백예린', '지우'], ['NO PAIN', '실리카겔', '현우'], ['水平線', 'back number', '유나']]
  rooms = { demo01: { id: 'demo01', title: '우리 단톡방 올해의 10곡', slots: 10, color: 0, names: true, owner: '지우', key: 'demo-key', opened: false, tracks: seed.map(([t, a, by], i) => ({ t, a, by, at: Date.now() - (7 - i) * 3.6e6 })) } }
  save()
}
const colorVars = (r) => `--c:${COLORS[r.color ?? 0][0]};--on-c:${COLORS[r.color ?? 0][1]}`

/* ════════ 소리: 툭(넣기)·바스락(흔들기)·찌익(뜯기). 첫 터치 뒤에 켜짐 ════════ */
let actx = null, soundOn = store.get('sound', true)
const snd = $('#snd'); snd.setAttribute('aria-pressed', String(soundOn))
snd.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); snd.setAttribute('aria-pressed', String(soundOn)); if (soundOn) blip(660, .06) })
addEventListener('pointerdown', () => { if (!actx) try { actx = new AudioContext() } catch { /* 소리 없음 */ } }, { once: true, capture: true })
function tone(f0, f1, dur, vol = .2, type = 'sine') {
  if (!actx || !soundOn) return
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain()
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur)
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur)
}
function noise(dur, f0, f1, vol = .25) {
  if (!actx || !soundOn) return
  const t = actx.currentTime, n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0)
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n)
  const s = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain()
  s.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur)
  g.gain.value = vol; s.connect(bp).connect(g).connect(actx.destination); s.start(t)
}
const blip = (f, d) => tone(f, f * 1.5, d, .12)
const thud = () => { tone(240, 70, .16, .35); noise(.08, 900, 300, .15) }
const rustle = () => noise(.22, 1800, 3200, .12)

/* ════════ 주머니 그리기 ════════ */
function rng(seed) { let h = 2166136261; for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cardPos(r, i) { // 카드마다 정해진 자리·기울기 (같은 방이면 늘 같음)
  const n = rng(r.id + ':' + i), x = 9 + n() * 63, rot = (n() - .5) * 38, lift = (i % 4) * 2.2 + n() * 3
  return `left:${x.toFixed(1)}%;bottom:${(30 + lift).toFixed(1)}%;transform:rotate(${rot.toFixed(1)}deg);z-index:${i + 1}`
}
function pouchHtml(r, { sm = false, tape = false, count = r.tracks.length } = {}) {
  const mine = me[r.id]?.idx
  return `<div class="pouch${sm ? ' sm' : ''}" ${sm ? '' : 'data-pouch role="button" tabindex="0" aria-label="주머니. 누르면 흔들려요"'} style="${colorVars(r)}">
    <div class="p-back"></div>
    <div class="p-cards">${Array.from({ length: count }, (_, i) => `<div class="card${i === mine ? ' mine' : ''}" style="${cardPos(r, i)}"></div>`).join('')}</div>
    <svg class="p-front" viewBox="0 0 300 192" preserveAspectRatio="none" aria-hidden="true"><path class="body" d="M0 30 Q150 112 300 30 L300 148 Q300 192 256 192 L44 192 Q0 192 0 148 Z"/><path class="stitch" d="M14 44 Q150 122 286 44"/></svg>
    <div class="p-tag">${count}<small> / ${r.slots}</small></div>
    ${tape ? '<div class="tape"><div class="tape-strip">OPEN ME</div><button class="tab" data-tab aria-label="테이프 뜯기. 오른쪽으로 끌거나 눌러요">→</button></div>' : ''}
  </div>`
}
function wobble(el, k = 1) {
  if (RM || !el) return
  el.animate([{ transform: 'rotate(0) scale(1)' }, { transform: `rotate(${-4 * k}deg) scale(1.02,.97)` }, { transform: `rotate(${3 * k}deg)` }, { transform: `rotate(${-1.5 * k}deg)` }, { transform: 'none' }], { duration: 520, easing: 'ease-out' })
  el.querySelectorAll('.card').forEach((c, i) => c.animate([{ translate: '0 0' }, { translate: `0 ${-6 - (i % 3) * 3}px` }, { translate: '0 0' }], { duration: 380, delay: i * 18, easing: 'cubic-bezier(.3,1.6,.5,1)' }))
}

/* ════════ 라우팅: #/ · #/new · #/r/<id>[?k=열쇠] ════════ */
function parse() { const [path, q] = location.hash.slice(1).split('?'); return { parts: path.split('/').filter(Boolean), key: new URLSearchParams(q || '').get('k') } }
const go = (h) => { location.hash = h }
const roomUrl = (r, admin) => location.href.split('#')[0] + '#/r/' + r.id + (admin ? '?k=' + r.key : '')
const isFull = (r) => r.tracks.length >= r.slots
const isOpen = (r) => r.opened || isFull(r)
const isOwner = (r) => own[r.id] === r.key
function render() {
  const { parts, key } = parse(), r = parts[0] === 'r' && rooms[parts[1]]
  document.documentElement.style.cssText = r ? colorVars(r) : ''
  if (r) {
    if (key && key === r.key && own[r.id] !== key) { own[r.id] = key; save() }
    return !isOpen(r) ? viewRoom(r) : me[r.id]?.seen ? viewOpened(r) : viewTear(r)
  }
  if (parts[0] === 'new') return viewNew()
  viewHome()
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0) })

/* ════════ 홈 ════════ */
function viewHome() {
  const demo = rooms.demo01 || Object.values(rooms)[0]
  const list = Object.values(rooms).sort((a, b) => (b.tracks.at(-1)?.at || 0) - (a.tracks.at(-1)?.at || 0))
  $('#view').innerHTML = `
    <div class="stack center" style="gap:10px;padding-top:8px"><h1>한 곡씩 몰래 넣고,<br>꽉 차면 같이 열어요</h1>
      <p class="sub">단톡방 친구들이 주머니에 곡 카드를 하나씩 넣어요.<br>다 찰 때까지 누가 뭘 넣었는지 아무도 몰라요.</p></div>
    ${demo ? pouchHtml(demo) : ''}
    <a class="btn ink full" href="#/new">새 주머니 만들기</a>
    ${list.length ? `<section class="stack" style="gap:10px;margin-top:8px"><h2>내 주머니</h2><div class="mini">${list.map((r) => `
      <a href="#/r/${r.id}">${pouchHtml(r, { sm: true })}<span class="ttl">${esc(r.title)}</span><span class="st">${isOpen(r) ? '개봉했어요' : `${r.slots - r.tracks.length}자리 남음`}</span></a>`).join('')}</div></section>` : ''}
    <p class="tiny center">Kanqaroo는 떡밥만 만들어요. 노는 건 단톡방에서.</p>`
  dropIn($('#view [data-pouch]'))
}
function dropIn(pouch) { // 처음 볼 때 카드가 하나씩 떨어져 쌓임
  if (RM || !pouch) return
  pouch.querySelectorAll('.card').forEach((c, i) => c.animate([{ translate: '0 -240%', opacity: 0 }, { translate: '0 0', opacity: 1 }], { duration: 560, delay: 120 + i * 70, easing: 'cubic-bezier(.25,1.5,.5,1)', fill: 'backwards' }))
}

/* ════════ 새 주머니 ════════ */
function viewNew() {
  const draft = { id: 'preview', title: '', slots: 10, color: 0, tracks: [] }
  $('#view').innerHTML = `
    <h1>새 주머니 만들기</h1>
    <div id="pv"></div>
    <form id="nf" class="panel" novalidate>
      <label class="field">주머니 이름<input type="text" id="n-title" maxlength="40" placeholder="우리 단톡방 올해의 10곡" required></label>
      <div class="field">색<div class="swatches">${COLORS.map(([c], i) => `<button type="button" class="sw" style="--s:${c}" data-sw="${i}" aria-label="색 ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}</div></div>
      <div class="field">자리 수 (넣을 사람 수)<div class="stepper"><button type="button" class="btn sm ghost" data-step="-1" aria-label="한 자리 빼기">−</button><output id="n-slots" aria-live="polite">10</output><button type="button" class="btn sm ghost" data-step="1" aria-label="한 자리 더하기">+</button></div></div>
      <label class="field">내 이름<input type="text" id="n-name" maxlength="12" placeholder="단톡방에서 쓰는 이름" required></label>
      <label class="check"><input type="checkbox" id="n-names" checked>열 때 넣은 사람 이름도 보여주기</label>
      <button class="btn ink full" type="submit">만들기</button>
    </form>`
  const pv = () => { $('#pv').innerHTML = pouchHtml(draft) }
  pv()
  $('#nf').addEventListener('click', (e) => {
    const s = e.target.closest('[data-step]'), w = e.target.closest('[data-sw]')
    if (s) { draft.slots = clamp(draft.slots + Number(s.dataset.step), 3, 30); $('#n-slots').textContent = draft.slots; pv(); blip(500 + draft.slots * 12, .05) }
    if (w) { draft.color = Number(w.dataset.sw); $('#nf').querySelectorAll('[data-sw]').forEach((b) => b.setAttribute('aria-pressed', String(b === w))); pv(); wobble($('#pv .pouch'), .6); rustle() }
  })
  $('#nf').addEventListener('submit', (e) => {
    e.preventDefault()
    const title = $('#n-title').value.trim(), name = $('#n-name').value.trim()
    if (!title) return $('#n-title').focus()
    if (!name) return $('#n-name').focus()
    const r = { id: uid(), title, slots: draft.slots, color: draft.color, names: $('#n-names').checked, owner: name, key: uid(10), opened: false, tracks: [] }
    rooms[r.id] = r; own[r.id] = r.key; me[r.id] = { name }; save()
    go('#/r/' + r.id); toast('만들었어요. 먼저 내 카드부터 넣어 볼까요?')
  })
}

/* ════════ 주머니 방 (모으는 중) ════════ */
function viewRoom(r, dropIdx = -1) {
  const my = me[r.id], joined = my?.idx != null, left = r.slots - r.tracks.length
  $('#view').innerHTML = `
    <div class="stack center" style="gap:4px"><p class="tiny">${esc(r.owner)}님의 블라인드 주머니</p><h1>${esc(r.title)}</h1></div>
    <div id="pz">${pouchHtml(r)}</div>
    <p class="tiny center">${left}자리 남았어요 · 주머니를 톡 쳐 봐요</p>
    ${joined ? `
      <section class="panel"><div><p class="tiny">내 카드 · ${my.idx + 1}번째로 넣음 (나만 보여요)</p>
        <p style="font-weight:700">${esc(r.tracks[my.idx].t)} <span class="sub">${esc(r.tracks[my.idx].a)}</span></p></div>
        <div class="row"><button class="btn colored" data-act="share">링크 던지기</button><button class="btn" data-act="nudge">독촉장 쓰기</button></div>
        <div id="nudge-box" class="stack"></div></section>`
    : `
      <div class="flip" id="flip"><div class="flip-in">
        <form class="face front" id="sf" novalidate>
          <div class="band"><span>${r.tracks.length + 1}번째 카드</span><span>몰래 넣기</span></div>
          <div class="lines">
            <label>곡 제목<input type="text" id="s-t" maxlength="60" autocomplete="off" required></label>
            <label>아티스트<input type="text" id="s-a" maxlength="60" autocomplete="off" required></label>
            <label>내 이름<input type="text" id="s-n" maxlength="12" value="${esc(my?.name || '')}" placeholder="단톡방에서 쓰는 이름" required></label>
            <button class="btn ink full" type="submit">봉인하기</button>
            <p class="tiny center" style="margin-top:8px">한 사람당 한 곡. 넣고 나면 바꿀 수 없어요.</p>
          </div>
        </form>
        <div class="face back" id="sealed" aria-hidden="true"><span class="up" aria-hidden="true">↑</span><div class="seal">K</div><p>위로 밀어서 주머니에 넣어요</p>
          <div class="row" style="padding:0 18px 18px;width:100%"><button class="btn ghost sm" data-act="unseal" tabindex="-1">다시 쓰기</button><button class="btn colored sm" data-act="drop" tabindex="-1">주머니에 넣기</button></div></div>
      </div></div>
      <button class="btn ghost full" data-act="share">링크만 던지기</button>`}
    ${isOwner(r) ? `<section class="panel"><h2>만든 사람만 보여요</h2>
      <p class="sub">끝까지 안 넣는 사람이 있으면 지금 있는 카드로 열 수 있어요.</p>
      <div class="row"><button class="btn ghost sm" data-act="force" ${r.tracks.length ? '' : 'disabled'}>지금 열기</button><button class="btn ghost sm" data-act="admin-link">관리 링크 복사</button></div>
      <p class="tiny">관리 링크로 들어오면 다른 기기에서도 만든 사람이 돼요. 단톡방엔 올리지 마세요.</p></section>` : ''}
    ${demoTools()}`
  const pouch = $('#pz [data-pouch]')
  if (dropIdx >= 0 && !RM) {
    const c = pouch.querySelectorAll('.card')[dropIdx]
    c.animate([{ translate: '0 -320%' }, { translate: '0 0' }], { duration: 620, easing: 'cubic-bezier(.25,1.45,.5,1)' })
    setTimeout(() => { thud(); pouch.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.04,.94)' }, { transform: 'scale(.99,1.02)' }, { transform: 'none' }], { duration: 420, easing: 'ease-out' }) }, 380)
  } else if (dropIdx < 0) dropIn(pouch)
  const sf = $('#sf')
  if (sf) {
    sf.addEventListener('submit', (e) => {
      e.preventDefault()
      for (const id of ['s-t', 's-a', 's-n']) if (!$('#' + id).value.trim()) return $('#' + id).focus()
      $('#flip').classList.add('sealed'); sf.inert = true; $('#sealed').removeAttribute('aria-hidden'); $('#sealed').querySelectorAll('button').forEach((b) => b.removeAttribute('tabindex'))
      tone(500, 900, .12, .1); setTimeout(() => $('[data-act="drop"]')?.focus({ preventScroll: true }), 300)
    })
    dragToPouch(r)
  }
}

// 봉인한 카드를 위로 끌거나 튕기면 주머니로 날아감
function dragToPouch(r) {
  const flip = $('#flip'), back = $('#sealed')
  let d = null
  back.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; d = { y: e.clientY, x: e.clientX, t: performance.now(), dy: 0, dx: 0, v: 0 }; back.setPointerCapture(e.pointerId) })
  back.addEventListener('pointermove', (e) => {
    if (!d) return
    const now = performance.now(), dy = Math.min(40, e.clientY - d.y), dx = (e.clientX - d.x) * .4
    d.v = (dy - d.dy) / Math.max(1, now - d.t); d.dy = dy; d.dx = dx; d.t = now
    flip.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * .05}deg) scale(${1 + Math.max(0, -dy) / 2000})`
  })
  const end = () => {
    if (!d) return
    const { dy, v } = d; d = null
    if (dy < -90 || v < -.8) return fly(r)
    flip.animate([{ transform: flip.style.transform || 'none' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' }); flip.style.transform = ''
  }
  back.addEventListener('pointerup', end); back.addEventListener('pointercancel', end)
}
function fly(r) {
  const t = $('#s-t').value.trim(), a = $('#s-a').value.trim(), by = $('#s-n').value.trim()
  if (isFull(r)) return render()
  const commit = () => {
    r.tracks.push({ t, a, by, at: Date.now() }); me[r.id] = { name: by, idx: r.tracks.length - 1 }; save()
    if (isFull(r)) { thud(); render(); toast('마지막 카드였어요. 이제 열 수 있어요!') } else { viewRoom(r, r.tracks.length - 1); toast('쏙. 다 차면 같이 열려요') }
  }
  if (RM) return commit()
  const flip = $('#flip'), pouch = $('#pz [data-pouch]'), from = flip.getBoundingClientRect(), to = pouch.getBoundingClientRect()
  noise(.18, 600, 2400, .1)
  const ghost = document.createElement('div'); ghost.className = 'fly'; ghost.style.cssText = `left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;border-radius:14px;background:#FFFDF8;box-shadow:var(--shadow)`
  document.body.append(ghost); flip.style.visibility = 'hidden'
  const tx = to.left + to.width / 2 - (from.left + from.width / 2), ty = to.top + to.height * .35 - (from.top + from.height / 2)
  ghost.animate([{ transform: flip.style.transform || 'none' }, { transform: `translate(${tx * .6}px, ${ty * .6 - 80}px) rotate(-12deg) scale(.45)`, offset: .55 }, { transform: `translate(${tx}px, ${ty}px) rotate(8deg) scale(.16)`, opacity: .9 }], { duration: 640, easing: 'cubic-bezier(.4,0,.3,1)' }).finished.then(() => { ghost.remove(); commit() })
}

/* ════════ 개봉: 테이프를 끝까지 당겨 찢기 ════════ */
function viewTear(r) {
  const forced = r.opened && !isFull(r)
  $('#view').innerHTML = `
    <div class="stack center" style="gap:4px"><p class="tiny">${forced ? '만든 사람이 지금 열기로 했어요' : '꽉 찼어요!'}</p><h1>${esc(r.title)}</h1></div>
    <div id="pz">${pouchHtml(r, { tape: true })}</div>
    <p class="center sub">테이프를 오른쪽으로 끝까지 당겨요</p>
    <button class="btn ghost full" data-act="tear">그냥 바로 열기</button>`
  const pouch = $('#pz .pouch'), tape = $('.tape', pouch), tab = $('[data-tab]', pouch)
  if (!RM) tab.animate([{ translate: '0 0' }, { translate: '14px 0' }, { translate: '0 0' }], { duration: 1200, iterations: Infinity, easing: 'ease-in-out' })
  let d = null, last = 0, moved = false
  const set = (p) => { tape.style.setProperty('--torn', `${p * 100}%`); tape.style.setProperty('--tab', `${p * 100}%`) }
  tab.addEventListener('pointerdown', (e) => { d = { x: e.clientX, w: tape.getBoundingClientRect().width }; moved = false; tab.setPointerCapture(e.pointerId); tab.getAnimations().forEach((a) => a.cancel()) })
  tab.addEventListener('pointermove', (e) => {
    if (!d) return
    const p = clamp((e.clientX - d.x) / d.w, 0, 1); if (p > .02) moved = true; set(p)
    if (p - last > .06) { noise(.05, 1500 + p * 2500, 2500 + p * 2500, .14); last = p }
    if (p > .92) { d = null; tearOpen(r) }
  })
  tab.addEventListener('pointerup', () => { if (!d) return; d = null; last = 0; set(0) })
  tab.addEventListener('click', () => { if (!moved) tearOpen(r) }) // 키보드·탭 한 번으로도 열림
}
function tearOpen(r) {
  if (me[r.id]?.seen) return
  me[r.id] = { ...(me[r.id] || {}), seen: true }; save()
  const pouch = $('#pz .pouch')
  if (RM || !pouch) return render()
  noise(.45, 800, 5000, .3)
  const tape = $('.tape', pouch); tape.style.setProperty('--torn', '100%'); tape.style.setProperty('--tab', '100%')
  pouch.querySelectorAll('.card').forEach((c, i) => c.animate([{ translate: '0 0' }, { translate: `${(i % 2 ? 1 : -1) * (20 + i * 4)}px -${180 + (i % 3) * 40}%`, opacity: 0 }], { duration: 700, delay: 120 + i * 45, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' }))
  pouch.animate([{ transform: 'none' }, { transform: 'scale(1.06,.92)' }, { transform: 'none' }], { duration: 420, easing: 'ease-out' })
  setTimeout(() => { viewOpened(r, true); scrollTo({ top: 0 }) }, 120 + r.tracks.length * 45 + 520)
}
function viewOpened(r, fresh = false) {
  $('#view').innerHTML = `
    <div class="stack center" style="gap:4px"><p class="tiny">${r.tracks.length}장 · ${esc(r.owner)}님의 주머니</p><h1>${esc(r.title)}</h1></div>
    <div class="opened">${r.tracks.map((s, i) => `
      <article class="ocard"><span class="n">${i + 1}</span><span class="t">${esc(s.t)}</span>${r.names ? `<span class="by">${esc(s.by)}</span>` : '<span></span>'}<span class="a">${esc(s.a)}</span>
        <span class="listen">${listen(s)}</span></article>`).join('')}</div>
    <section class="panel"><h2>내 앱으로 가져가기</h2>
      <p class="sub">목록을 복사해서 TuneMyMusic 같은 변환 서비스에 붙여 넣으면 Spotify·Apple Music·YouTube Music 플리가 돼요.</p>
      <div class="row"><button class="btn ink" data-act="copy-list">목록 복사</button><button class="btn" data-act="csv">CSV 받기</button></div>
      <a class="btn ghost full" href="https://www.tunemymusic.com/" target="_blank" rel="noopener">TuneMyMusic 열기</a></section>
    <div class="row"><button class="btn colored" data-act="share">연 주머니 공유</button><button class="btn ghost" data-act="replay">다시 뜯어 보기</button></div>
    <section class="demo"><button class="btn ghost sm" data-act="reset">처음 상태로 되돌리기 (데모)</button></section>`
  if (fresh && !RM) $('#view').querySelectorAll('.ocard').forEach((c, i) => {
    c.animate([{ transform: 'rotateX(-80deg) translateY(-20px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520, delay: i * 110, easing: 'cubic-bezier(.25,1.3,.5,1)', fill: 'backwards' })
    setTimeout(() => blip(520 + i * 40, .05), i * 110)
  })
}
function listen(s) {
  const q = encodeURIComponent(`${s.t} ${s.a}`)
  return `<a href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noopener">YouTube</a><a href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">Spotify</a><a href="https://music.apple.com/kr/search?term=${q}" target="_blank" rel="noopener">Apple Music</a>`
}
const demoTools = () => `<section class="demo"><p class="tiny">데모 도구 · 서버가 없어서 친구 역할도 이 기기에서 해 봐요</p>
  <div class="row"><button class="btn ghost sm" data-act="as-friend">다른 친구로 들어가기</button><button class="btn ghost sm" data-act="fill">가짜 친구로 채우기</button></div></section>`

/* ════════ 동작 ════════ */
async function copy(text, done) { try { await navigator.clipboard.writeText(text); toast(done) } catch { prompt('복사해서 쓰세요', text) } }
async function share(r) {
  const url = roomUrl(r), text = isOpen(r) ? `'${r.title}' 열었어 🦘` : `'${r.title}' 주머니에 한 곡 몰래 넣어줘. 꽉 차면 같이 열자 🦘`
  if (navigator.share && top === self) { try { await navigator.share({ title: 'Kanqaroo', text, url }); return } catch (e) { if (e.name === 'AbortError') return } }
  copy(`${text}\n${url}`, '링크를 복사했어요. 단톡방에 던져요')
}
const FAKE = [['밤양갱', '비비', '수아'], ['Supernova', 'aespa', '태오'], ['Magnetic', 'ILLIT', '하린'], ['Ditto', 'NewJeans', '민재'], ['唱', 'Ado', '예린'], ['APT.', 'ROSÉ', '준서'], ['Seven', '정국', '채원'], ['Love wins all', '아이유', '시우'], ['Kick It', 'NCT 127', '다은'], ['나는 아픈 건 딱 질색이니까', '(여자)아이들', '건우']]

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { go('#/' + g.dataset.go); return }
  const pz = e.target.closest('[data-pouch]')
  if (pz && !e.target.closest('.tape')) {
    if (!parse().parts.length && rooms.demo01) { wobble(pz); rustle(); setTimeout(() => go('#/r/demo01'), 380); return }
    wobble(pz); rustle(); return
  }
  const b = e.target.closest('[data-act]'); if (!b) return
  const r = rooms[parse().parts[1]], act = b.dataset.act
  if (act === 'share') share(r)
  else if (act === 'drop') fly(r)
  else if (act === 'unseal') { $('#flip').classList.remove('sealed'); $('#sf').inert = false; $('#s-t').focus() }
  else if (act === 'nudge') {
    const msg = `'${r.title}'\n${r.tracks.length}/${r.slots} 찼어. ${r.slots - r.tracks.length}자리 남았는데… 혹시 너?\n한 곡만 몰래 넣어줘 🦘\n${roomUrl(r)}`
    $('#nudge-box').innerHTML = `<div class="postcard"><pre>${esc(msg)}</pre><div class="stamp">독촉장<br>📮</div></div><button class="btn ink full" data-act="copy-nudge">복사해서 단톡방에 붙이기</button>`
    $('#nudge-box').dataset.msg = `📮 [Kanqaroo 독촉장]\n${msg}`
    if (!RM) $('.postcard').animate([{ transform: 'translateY(30px) rotate(6deg)', opacity: 0 }, { transform: 'rotate(-1.2deg)', opacity: 1 }], { duration: 480, easing: 'cubic-bezier(.25,1.4,.5,1)' })
    tone(700, 1100, .1, .1)
  }
  else if (act === 'copy-nudge') copy($('#nudge-box').dataset.msg, '독촉장을 복사했어요')
  else if (act === 'admin-link') copy(roomUrl(r, true), '관리 링크를 복사했어요')
  else if (act === 'force') { if (confirm(`지금 있는 ${r.tracks.length}장으로 열까요? 되돌릴 수 없어요.`)) { r.opened = true; save(); render() } }
  else if (act === 'as-friend') { delete me[r.id]; save(); render(); toast('다른 친구가 됐어요. 카드를 써 봐요') }
  else if (act === 'fill') {
    let k = 0
    while (!isFull(r)) { const [t, a, by] = FAKE[k++ % FAKE.length]; r.tracks.push({ t, a, by, at: Date.now() }) }
    save(); thud(); render(); toast('꽉 찼어요! 테이프를 뜯어요')
  }
  else if (act === 'tear') tearOpen(r)
  else if (act === 'replay') { me[r.id] = { ...(me[r.id] || {}), seen: false }; save(); render() }
  else if (act === 'copy-list') copy(r.tracks.map((s) => `${s.t} - ${s.a}`).join('\n'), '목록을 복사했어요')
  else if (act === 'csv') {
    const cell = (v) => `"${String(v).replace(/"/g, '""')}"`
    const csv = '﻿Track,Title,Artist' + (r.names ? ',Added by' : '') + '\n' + r.tracks.map((s, i) => [i + 1, cell(s.t), cell(s.a), ...(r.names ? [cell(s.by)] : [])].join(',')).join('\n')
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${r.title}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
  }
  else if (act === 'reset') { if (confirm('예시 데이터로 되돌릴까요? 이 기기에 저장된 주머니가 모두 지워져요.')) { ['rooms', 'me', 'own'].forEach((k) => { try { localStorage.removeItem('kq2.' + k) } catch {} }); location.hash = ''; location.reload() } }
})
document.addEventListener('keydown', (e) => { const pz = e.target.closest?.('[data-pouch]'); if (pz && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pz.click() } })

let tt = 0
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true }, 2400) }
render()
</script>
