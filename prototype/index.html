<meta name="description" content="친구들이 한 곡씩 몰래 넣어 같이 완성하는 블라인드 플레이리스트">
<title>Kanqaroo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══ Kanqaroo 임시 디자인 시스템 (DESIGN.md 참고)
   레퍼런스: Variadex 카드 서랍(탭·색 분류) · Snootie 원색 블록(검은 테두리·스티커) · 신문형 웹(고정폭·괘선)
   원색 블록과 굵은 테두리는 "만지는 것"(카드·버튼·서랍), 얇은 괘선은 "읽는 것"(목록·메타) ══ */
:root {
  color-scheme: light;
  --bg: #D2D2CE; --paper: #FBFAF4; --card: #F4E39B; --plate: #E8E8E2; --ink: #111111; --ink-2: #4A4A46; --ink-3: #7A7A74;
  --blue: #2236C4; --orange: #E8650E; --green: #4C9265; --red: #D72A35; --yellow: #F6D945; --pink: #EFA0BD; --violet: #8556D4;
  --bd: 2px solid var(--ink); --sh: 3px 3px 0 var(--ink); --sh-lg: 5px 5px 0 var(--ink); --rule: 1px solid var(--ink);
  --r: 6px; --mono: 'IBM Plex Mono', 'Nanum Gothic Coding', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --c: var(--orange); --on-c: #111111;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.6 var(--mono); word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; display: block; height: 10px; background: var(--blue); border-bottom: var(--bd); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 460px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 48px); display: grid; gap: 14px; }

/* ── 블록: 원색 면 + 검은 테두리 + 어긋난 그림자 ── */
.blk { border: var(--bd); border-radius: var(--r); box-shadow: var(--sh); background: var(--paper); padding: 12px 14px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
.logo { font-weight: 700; font-size: 22px; letter-spacing: -0.04em; line-height: 1; cursor: pointer; display: grid; place-items: center; text-transform: lowercase; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 16px; border: var(--bd); border-radius: var(--r); box-shadow: var(--sh); background: var(--paper); font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; line-height: 1.35; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn.sm { min-height: 40px; font-size: 13px; padding: 0 12px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.c { background: var(--c); color: var(--on-c); }
/* 원색 면: 블록·버튼 어디에나 */
.on-blue { background: var(--blue); color: #fff; } .on-orange { background: var(--orange); color: #fff; } .on-green { background: var(--green); color: #fff; }
.on-red { background: var(--red); color: #fff; } .on-yellow { background: var(--yellow); } .on-ink { background: var(--ink); color: #fff; } .on-pink { background: var(--pink); }
.row { display: flex; gap: 10px; } .row > * { flex: 1 1 0; }

/* ── 읽는 것: 고정폭·자간 넓은 머리말·얇은 괘선 ── */
.cap { font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
.dateline { display: flex; justify-content: space-between; border-top: var(--rule); border-bottom: var(--rule); padding: 4px 0; }
h1 { margin: 0; font-size: 24px; line-height: 1.35; letter-spacing: -0.03em; font-weight: 700; }
h2 { margin: 0; font-size: 16px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--ink-2); font-size: 13px; }
.tiny { color: var(--ink-3); font-size: 12px; }
.center { text-align: center; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 10px; letter-spacing: .2em; font-weight: 700; border-bottom: var(--rule); padding: 4px 6px; }
.table td { border-bottom: var(--rule); padding: 8px 6px; vertical-align: top; }
.table a { text-decoration: none; display: block; }
.table .num { width: 3ch; font-weight: 700; }

/* ══ 주머니 서랍: 주머니(원색 몸통) 안에 카드 서랍. 카드는 탭만 보이게 줄지어 꽂힘 ══ */
.drawer { position: relative; width: min(330px, 86vw); aspect-ratio: 1 / 1.02; margin: 4px auto 6px; user-select: none; -webkit-user-select: none; transform-origin: 50% 95%; touch-action: manipulation; }
.drawer[data-drawer] { cursor: pointer; }
.d-body { position: absolute; inset: 0; background: var(--c); border: var(--bd); border-radius: 34px 34px 46% 46% / 34px 34px 30% 30%; box-shadow: var(--sh-lg); }
.d-well { position: absolute; left: 9%; right: 9%; top: 7%; height: 62%; background: color-mix(in oklab, var(--c) 55%, #000); border: var(--bd); border-radius: 10px; overflow: hidden; }
.ic { position: absolute; left: 5%; right: 5%; height: 34%; background: var(--card); border: var(--bd); border-radius: 3px; }
.ic::before { content: ""; position: absolute; left: 10%; right: 34%; top: 26%; height: 2px; background: color-mix(in oklab, var(--card) 70%, #000); box-shadow: 0 7px 0 color-mix(in oklab, var(--card) 70%, #000); opacity: .5; }
.ic .tab { position: absolute; top: -13px; height: 13px; min-width: 30%; padding: 0 6px; border: var(--bd); border-bottom: 0; border-radius: 3px 3px 0 0; background: var(--tc, var(--yellow)); font-size: 9px; font-weight: 700; line-height: 12px; letter-spacing: .1em; color: var(--ink); }
.ic.empty { background: none; border-color: transparent; } /* 빈 자리는 점선 탭만 */
.ic.empty::before { display: none; }
.ic.empty .tab { background: none; border-style: dashed; border-color: color-mix(in oklab, var(--c) 30%, #fff); color: color-mix(in oklab, var(--c) 25%, #fff); }
.ic.mine { background: var(--paper); }
.d-plate { position: absolute; left: 5%; right: 5%; bottom: 6%; height: 34%; background: var(--plate); border: var(--bd); border-radius: 8px 8px 40% 40% / 8px 8px 34% 34%; display: grid; align-content: center; justify-items: center; gap: 2px; }
.d-plate .cap { font-size: 9px; }
.d-plate .big { font-size: clamp(26px, 10vw, 40px); font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.d-plate .big small { font-size: .42em; letter-spacing: 0; color: var(--ink-2); }
.rivet { position: absolute; top: 16%; width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); border: var(--bd); }
.rivet.l { left: 6%; } .rivet.r { right: 6%; }
.drawer.sm { width: 100%; box-shadow: none; }
.drawer.sm .d-plate .big { font-size: 22px; }
/* 개봉 테이프 */
.tape { position: absolute; z-index: 5; left: -3%; right: -3%; top: 62%; height: 12%; transform: rotate(-3deg); pointer-events: none; }
.tape-strip { position: absolute; inset: 0; background: var(--red); border: var(--bd); clip-path: inset(-4px -4px -4px var(--torn, 0%)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .3em; }
.tab-pull { position: absolute; top: 50%; left: var(--tab, 0%); width: 50px; height: 50px; margin: -25px 0 0 -6px; border: var(--bd); border-radius: 999px; background: var(--yellow); box-shadow: var(--sh); display: grid; place-items: center; font-size: 20px; font-weight: 700; pointer-events: auto; touch-action: none; cursor: grab; }

/* ══ 카드 쓰기: 앞면(타자기 인덱스 카드) → 봉인된 뒷면 → 위로 밀어 서랍에 ══ */
.flip { perspective: 1200px; touch-action: pan-y; margin-top: 14px; }
.flip-in { position: relative; display: grid; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); }
.flip.sealed .flip-in { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border: var(--bd); border-radius: 4px; box-shadow: var(--sh-lg); position: relative; }
.face > .tab { position: absolute; top: -26px; left: 14px; height: 26px; padding: 0 12px; border: var(--bd); border-bottom: 0; border-radius: 4px 4px 0 0; background: var(--c); color: var(--on-c); display: flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .18em; }
.face.back { transform: rotateY(180deg); display: grid; place-items: center; align-content: center; gap: 10px; padding: 24px 16px 16px; touch-action: none; cursor: grab; }
.face.back .stamp { padding: 8px 14px; border: 3px solid var(--red); color: var(--red); font-weight: 700; letter-spacing: .3em; transform: rotate(-6deg); }
.face.back .up { font-size: 26px; font-weight: 700; animation: nudge 1.3s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-8px); } }
.lines { padding: 10px 16px 16px; display: grid; }
.lines label { display: grid; grid-template-columns: 7.5ch 1fr; align-items: end; gap: 8px; padding-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
.lines input { border: 0; border-bottom: var(--rule); background: none; height: 34px; font: 700 16px var(--mono); padding: 0 2px; border-radius: 0; }
.lines input:focus { outline: none; border-bottom: 2px solid var(--ink); background: color-mix(in oklab, var(--card) 70%, #fff); }

/* 독촉장 · 개봉 카드 · 폼 */
.notice { background: var(--paper); border: var(--bd); border-radius: 4px; box-shadow: var(--sh); padding: 0; overflow: hidden; transform: rotate(-1deg); }
.notice .head { background: var(--red); color: #fff; padding: 6px 12px; border-bottom: var(--bd); }
.notice pre { margin: 0; padding: 12px; font: 500 13px/1.6 var(--mono); white-space: pre-wrap; word-break: break-all; }
.ocards { display: grid; gap: 22px; padding-top: 14px; perspective: 1000px; }
.oc { position: relative; background: var(--card); border: var(--bd); border-radius: 4px; box-shadow: var(--sh); padding: 12px 14px; display: grid; gap: 2px; transform-origin: 50% 0; }
.oc .tab { position: absolute; top: -18px; height: 18px; padding: 0 8px; border: var(--bd); border-bottom: 0; border-radius: 3px 3px 0 0; background: var(--tc); font-size: 10px; font-weight: 700; letter-spacing: .14em; line-height: 16px; }
.oc .t { font-weight: 700; font-size: 16px; line-height: 1.35; }
.oc .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); border-top: var(--rule); padding-top: 6px; margin-top: 6px; }
.oc .listen { display: flex; gap: 6px; flex-wrap: wrap; }
.oc .listen a { font-size: 11px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--ink); border-radius: 3px; padding: 0 6px; background: var(--paper); }
.field { display: grid; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.field input[type="text"] { height: 46px; padding: 0 12px; border: var(--bd); border-radius: 4px; background: var(--paper); font: 700 15px var(--mono); }
.field input[type="text"]:focus { outline: none; box-shadow: var(--sh); }
.sws { display: flex; gap: 8px; }
.sw { width: 34px; height: 34px; border: var(--bd); border-radius: 4px; background: var(--s); cursor: pointer; }
.sw[aria-pressed="true"] { box-shadow: var(--sh); transform: translate(-2px, -2px); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper output { min-width: 3ch; text-align: center; font-size: 24px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
.demo { border-top: 1px dashed var(--ink); padding-top: 12px; display: grid; gap: 8px; }
.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: var(--yellow); border: var(--bd); box-shadow: var(--sh); border-radius: 4px; padding: 10px 16px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fly { position: fixed; z-index: 8; pointer-events: none; background: var(--card); border: var(--bd); border-radius: 4px; }
.sticker { position: absolute; z-index: 6; right: -6px; top: 10px; transform: rotate(8deg); background: var(--yellow); border: var(--bd); border-radius: 4px 14px 4px 14px; padding: 4px 10px; font-size: 13px; font-weight: 700; box-shadow: var(--sh); }
@media (prefers-reduced-motion: reduce) { .face.back .up { animation: none; } .flip-in { transition: none; } }
</style>

<div class="wrap">
  <header class="grid" aria-label="머리">
    <button class="blk on-orange logo s2" data-go="" aria-label="kanqaroo 처음으로">kanq<br>aroo</button>
    <div class="blk on-yellow s3" style="display:grid;align-content:center;font-size:12px;font-weight:700;line-height:1.4">단톡방 친구들이<br>몰래 채우는 플리</div>
    <button class="blk on-ink s1" id="snd" aria-label="소리" aria-pressed="true" style="grid-column:span 1;font-size:18px;cursor:pointer;padding:0">♪</button>
  </header>
  <p class="dateline cap" id="dateline"></p>
  <main id="view" style="display:grid;gap:14px"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s)
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const pad = (n) => String(n).padStart(2, '0')

/* ════════ 저장 (데모: 서버 없이 이 기기 localStorage) ════════ */
const store = {
  get(k, d) { try { const v = localStorage.getItem('kq3.' + k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem('kq3.' + k, JSON.stringify(v)) } catch { /* 저장 못 함 */ } },
}
const uid = (n = 6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('')
// 주머니 색 (원색 블록) · 카드 탭 색은 순서대로 돌아감
const COLORS = [['#E8650E', '#111111'], ['#2236C4', '#FFFFFF'], ['#4C9265', '#FFFFFF'], ['#D72A35', '#FFFFFF'], ['#F6D945', '#111111'], ['#8556D4', '#FFFFFF']]
const TABS = ['var(--yellow)', 'var(--pink)', 'var(--green)', 'var(--blue)', 'var(--orange)', 'var(--violet)', 'var(--red)']
const tabInk = (i) => ([2, 3, 5, 6].includes(i % TABS.length) ? '#fff' : 'var(--ink)')
let rooms = store.get('rooms', null)
const me = store.get('me', {})   // 방마다 { name, idx, seen }
const own = store.get('own', {}) // 방마다 만든 사람 열쇠
const save = () => { store.set('rooms', rooms); store.set('me', me); store.set('own', own) }
if (!rooms) { // 체험용 예시: 9자리 중 6자리 참
  const seed = [['Hikaru Nara', 'Goose house', '민지'], ['Antifreeze', '검정치마', '도윤'], ['Plastic Love', '竹内まりや', '서연'], ['Nights', 'Frank Ocean', '하준'], ['Square (2017)', '백예린', '지우'], ['NO PAIN', '실리카겔', '현우']]
  rooms = { demo01: { id: 'demo01', title: '우리 단톡방 올해의 9곡', slots: 9, color: 0, names: true, owner: '지우', key: 'demo-key', opened: false, created: Date.now() - 864e5, tracks: seed.map(([t, a, by], i) => ({ t, a, by, at: Date.now() - (6 - i) * 3.6e6 })) } }
  save()
}
const colorVars = (r) => `--c:${COLORS[r.color ?? 0][0]};--on-c:${COLORS[r.color ?? 0][1]}`
{ const d = new Date(), w = '일월화수목금토'[d.getDay()]; $('#dateline').innerHTML = `<span>${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${w}</span><span>blind file no.${pad(Object.keys(rooms).length)}</span>` }

/* ════════ 소리: 툭(꽂기)·탁탁(흔들기)·찌익(뜯기) ════════ */
let actx = null, soundOn = store.get('sound', true)
const snd = $('#snd'); snd.setAttribute('aria-pressed', String(soundOn)); snd.style.opacity = soundOn ? 1 : .5
snd.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); snd.setAttribute('aria-pressed', String(soundOn)); snd.style.opacity = soundOn ? 1 : .5; if (soundOn) blip(660, .06) })
addEventListener('pointerdown', () => { if (!actx) try { actx = new AudioContext() } catch { /* 소리 없음 */ } }, { once: true, capture: true })
function tone(f0, f1, dur, vol = .2, type = 'sine') {
  if (!actx || !soundOn) return
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain()
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur)
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur)
}
function noise(dur, f0, f1, vol = .25) {
  if (!actx || !soundOn) return
  const t = actx.currentTime, n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0)
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n)
  const s = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain()
  s.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur)
  g.gain.value = vol; s.connect(bp).connect(g).connect(actx.destination); s.start(t)
}
const blip = (f, d) => tone(f, f * 1.5, d, .12, 'square')
const thud = () => { tone(200, 70, .14, .3); noise(.06, 2400, 900, .2) }
const clack = () => { for (let i = 0; i < 4; i++) setTimeout(() => noise(.03, 3000, 1500, .14), i * 45) }

/* ════════ 주머니 서랍 그리기: 뒤 카드가 위, 앞 카드가 아래로 겹침. 탭은 왼·가운데·오른쪽으로 엇갈림 ════════ */
function cardStyle(r, i) {
  const n = Math.max(1, r.slots - 1), top = 12 + (i / n) * 54
  return `top:${top.toFixed(1)}%;z-index:${i + 1}`
}
function drawerHtml(r, { sm = false, tape = false } = {}) {
  const mine = me[r.id]?.idx, count = r.tracks.length
  const cards = Array.from({ length: r.slots }, (_, i) => {
    const pos = ['left:4%', 'left:36%', 'right:4%'][i % 3]
    return i < count
      ? `<div class="ic${i === mine ? ' mine' : ''}" style="${cardStyle(r, i)}"><span class="tab" style="${pos};--tc:${TABS[i % TABS.length]};color:${tabInk(i)}">${i === mine ? 'ME' : 'NO.' + pad(i + 1)}</span></div>`
      : `<div class="ic empty" style="${cardStyle(r, i).replace(/z-index:\d+/, 'z-index:0')}"><span class="tab" style="${pos}">${pad(i + 1)}</span></div>`
  }).join('')
  return `<div class="drawer${sm ? ' sm' : ''}" ${sm ? '' : 'data-drawer role="button" tabindex="0" aria-label="주머니 서랍. 누르면 흔들려요"'} style="${colorVars(r)}">
    <div class="d-body"></div>
    <div class="d-well">${cards}</div>
    <div class="d-plate"><span class="rivet l"></span><span class="rivet r"></span><span class="cap">kanqaroo blind file</span><span class="big">${count}<small> / ${r.slots}</small></span><span class="cap">1 card each</span></div>
    ${tape ? '<div class="tape"><div class="tape-strip">SEALED · OPEN ME</div><button class="tab-pull" data-pull aria-label="테이프 뜯기. 오른쪽으로 끌거나 눌러요">→</button></div>' : ''}
  </div>`
}
function shake(el, k = 1) {
  if (RM || !el) return
  el.animate([{ transform: 'none' }, { transform: `rotate(${-3 * k}deg) translateY(-2px)` }, { transform: `rotate(${2.5 * k}deg)` }, { transform: `rotate(${-1 * k}deg)` }, { transform: 'none' }], { duration: 460, easing: 'ease-out' })

/* ════════ 라우팅: #/ · #/new · #/r/<id>[?k=열쇠] ════════ */
function parse() { const [path, q] = location.hash.slice(1).split('?'); return { parts: path.split('/').filter(Boolean), key: new URLSearchParams(q || '').get('k') } }
const go = (h) => { location.hash = h }
const roomUrl = (r, admin) => location.href.split('#')[0] + '#/r/' + r.id + (admin ? '?k=' + r.key : '')
const isFull = (r) => r.tracks.length >= r.slots
const isOpen = (r) => r.opened || isFull(r)
const isOwner = (r) => own[r.id] === r.key
function render() {
  const { parts, key } = parse(), r = parts[0] === 'r' && rooms[parts[1]]
  document.documentElement.style.cssText = r ? colorVars(r) : ''
  if (r) {
    if (key && key === r.key && own[r.id] !== key) { own[r.id] = key; save() }
    return !isOpen(r) ? viewRoom(r) : me[r.id]?.seen ? viewOpened(r) : viewTear(r)
  }
  if (parts[0] === 'new') return viewNew()
  viewHome()
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0) })

// 봉인한 카드를 위로 끌거나 튕기면 서랍으로 날아감
function dragToDrawer(r) {
  const flip = $('#flip'), back = $('#sealed')
  let d = null
  back.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; d = { y: e.clientY, x: e.clientX, t: performance.now(), dy: 0, v: 0 }; back.setPointerCapture(e.pointerId) })
  back.addEventListener('pointermove', (e) => {
    if (!d) return
    const now = performance.now(), dy = Math.min(40, e.clientY - d.y), dx = (e.clientX - d.x) * .4
    d.v = (dy - d.dy) / Math.max(1, now - d.t); d.dy = dy; d.t = now
    flip.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * .05}deg)`
  })
  const end = () => {
    if (!d) return
    const { dy, v } = d; d = null
    if (dy < -90 || v < -.8) return fly(r)
    flip.animate([{ transform: flip.style.transform || 'none' }, { transform: 'none' }], { duration: 400, easing: 'cubic-bezier(.3,1.5,.5,1)' }); flip.style.transform = ''
  }
  back.addEventListener('pointerup', end); back.addEventListener('pointercancel', end)
}
function fly(r) {
  const t = $('#s-t').value.trim(), a = $('#s-a').value.trim(), by = $('#s-n').value.trim()
  if (isFull(r)) return render()
  const commit = () => {
    r.tracks.push({ t, a, by, at: Date.now() }); me[r.id] = { name: by, idx: r.tracks.length - 1 }; save()
    if (isFull(r)) { thud(); render(); toast('마지막 카드였어요. 이제 열 수 있어요') } else { viewRoom(r, r.tracks.length - 1); toast('착. 다 차면 같이 열려요') }
  }
  if (RM) return commit()
  const flip = $('#flip'), dr = $('#dz [data-drawer]'), from = flip.getBoundingClientRect(), to = dr.getBoundingClientRect()
  noise(.16, 700, 2600, .12)
  const ghost = document.createElement('div'); ghost.className = 'fly'; ghost.style.cssText = `left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px`
  document.body.append(ghost); flip.style.visibility = 'hidden'
  const tx = to.left + to.width / 2 - (from.left + from.width / 2), ty = to.top + to.height * .3 - (from.top + from.height / 2)
  ghost.animate([{ transform: flip.style.transform || 'none' }, { transform: `translate(${tx * .5}px, ${ty * .6 - 60}px) rotate(-8deg) scale(.55, .45)`, offset: .55 }, { transform: `translate(${tx}px, ${ty}px) scale(.8, .12)`, opacity: .9 }], { duration: 600, easing: 'cubic-bezier(.4,0,.3,1)' }).finished.then(() => { ghost.remove(); commit() })
}

/* ════════ 개봉: 빨간 봉인 테이프를 끝까지 당겨 찢기 ════════ */
function viewTear(r) {
  const forced = r.opened && !isFull(r)
  $('#view').innerHTML = `
    <section class="blk" style="${colorVars(r)};background:var(--c);color:var(--on-c)"><p class="cap">${forced ? '만든 사람이 지금 열기로 했어요' : '꽉 찼어요'}</p><h1>${esc(r.title)}</h1></section>

    <button class="btn full" data-act="tear">그냥 바로 열기</button>`
  const dr = $('#dz .drawer'), tape = $('.tape', dr), tab = $('[data-pull]', dr)
  if (!RM) tab.animate([{ translate: '0 0' }, { translate: '14px 0' }, { translate: '0 0' }], { duration: 1200, iterations: Infinity, easing: 'ease-in-out' })
  let d = null, last = 0, moved = false
  const set = (p) => { tape.style.setProperty('--torn', `${p * 100}%`); tape.style.setProperty('--tab', `${p * 100}%`) }
  tab.addEventListener('pointerdown', (e) => { d = { x: e.clientX, w: tape.getBoundingClientRect().width }; moved = false; tab.setPointerCapture(e.pointerId); tab.getAnimations().forEach((a) => a.cancel()) })
  tab.addEventListener('pointermove', (e) => {
    if (!d) return
    const p = clamp((e.clientX - d.x) / d.w, 0, 1); if (p > .02) moved = true; set(p)
    if (p - last > .06) { noise(.05, 1500 + p * 2500, 2500 + p * 2500, .16); last = p }
    if (p > .92) { d = null; tearOpen(r) }
  })
  tab.addEventListener('pointerup', () => { if (!d) return; d = null; last = 0; set(0) })
  tab.addEventListener('click', () => { if (!moved) tearOpen(r) }) // 키보드·탭 한 번으로도 열림
}
function tearOpen(r) {
  if (me[r.id]?.seen) return
  me[r.id] = { ...(me[r.id] || {}), seen: true }; save()
  const dr = $('#dz .drawer')

  const tape = $('.tape', dr); tape.style.setProperty('--torn', '100%'); tape.style.setProperty('--tab', '100%')
  dr.querySelectorAll('.ic:not(.empty)').forEach((c, i) => c.animate([{ translate: '0 0' }, { translate: `0 -${260 + i * 30}%`, opacity: 0 }], { duration: 560, delay: 80 + (r.tracks.length - i) * 50, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' }))
  dr.animate([{ transform: 'none' }, { transform: 'scale(1.05,.93)' }, { transform: 'none' }], { duration: 400, easing: 'ease-out' })
  setTimeout(() => { viewOpened(r, true); scrollTo({ top: 0 }) }, 80 + r.tracks.length * 50 + 480)
}

/* ════════ 동작 ════════ */
async function copy(text, done) { try { await navigator.clipboard.writeText(text); toast(done) } catch { prompt('복사해서 쓰세요', text) } }
async function share(r) {
  const url = roomUrl(r), text = isOpen(r) ? `'${r.title}' 열었어 🦘` : `'${r.title}' 주머니에 한 곡 몰래 넣어줘. 꽉 차면 같이 열자 🦘`
  if (navigator.share && top === self) { try { await navigator.share({ title: 'Kanqaroo', text, url }); return } catch (e) { if (e.name === 'AbortError') return } }
  copy(`${text}\n${url}`, '링크를 복사했어요. 단톡방에 던져요')
}
const FAKE = [['밤양갱', '비비', '수아'], ['Supernova', 'aespa', '태오'], ['Magnetic', 'ILLIT', '하린'], ['Ditto', 'NewJeans', '민재'], ['唱', 'Ado', '예린'], ['APT.', 'ROSÉ', '준서'], ['Seven', '정국', '채원'], ['Love wins all', '아이유', '시우'], ['Kick It', 'NCT 127', '다은']]

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { go('#/' + g.dataset.go); return }
  const dz = e.target.closest('[data-drawer]')
  if (dz && !e.target.closest('.tape')) {

  }
  const b = e.target.closest('[data-act]'); if (!b) return

  else if (act === 'nudge') {
    const msg = `'${r.title}'\n${r.tracks.length}/${r.slots} 찼어. ${r.slots - r.tracks.length}자리 남았는데… 혹시 너?\n한 곡만 몰래 넣어줘 🦘\n${roomUrl(r)}`
    $('#nudge-box').innerHTML = `<div class="notice"><div class="head cap">notice · 독촉장</div><pre>${esc(msg)}</pre></div><button class="btn on-ink full" data-act="copy-nudge">복사해서 단톡방에 붙이기</button>`
    $('#nudge-box').dataset.msg = `📮 [Kanqaroo 독촉장]\n${msg}`
    if (!RM) $('.notice').animate([{ transform: 'translateY(24px) rotate(5deg)', opacity: 0 }, { transform: 'rotate(-1deg)', opacity: 1 }], { duration: 440, easing: 'cubic-bezier(.25,1.4,.5,1)' })
    tone(700, 1100, .08, .1, 'square')
  }
  else if (act === 'copy-nudge') copy($('#nudge-box').dataset.msg, '독촉장을 복사했어요')
  else if (act === 'admin-link') copy(roomUrl(r, true), '관리 링크를 복사했어요')
  else if (act === 'force') { if (confirm(`지금 있는 ${r.tracks.length}장으로 열까요? 되돌릴 수 없어요.`)) { r.opened = true; save(); render() } }
  else if (act === 'as-friend') { delete me[r.id]; save(); render(); toast('다른 친구가 됐어요. 카드를 써 봐요') }
  else if (act === 'fill') {
    let k = 0
    while (!isFull(r)) { const [t, a, by] = FAKE[k++ % FAKE.length]; r.tracks.push({ t, a, by, at: Date.now() }) }
    save(); thud(); render(); toast('꽉 찼어요. 테이프를 뜯어요')
  }
  else if (act === 'tear') tearOpen(r)
  else if (act === 'replay') { me[r.id] = { ...(me[r.id] || {}), seen: false }; save(); render() }
  else if (act === 'copy-list') copy(r.tracks.map((s) => `${s.t} - ${s.a}`).join('\n'), '목록을 복사했어요')
  else if (act === 'csv') {
    const cell = (v) => `"${String(v).replace(/"/g, '""')}"`
    const csv = '﻿Track,Title,Artist' + (r.names ? ',Added by' : '') + '\n' + r.tracks.map((s, i) => [i + 1, cell(s.t), cell(s.a), ...(r.names ? [cell(s.by)] : [])].join(',')).join('\n')
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${r.title}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
  }
  else if (act === 'reset') { if (confirm('예시 데이터로 되돌릴까요? 이 기기에 저장된 주머니가 모두 지워져요.')) { ['rooms', 'me', 'own'].forEach((k) => { try { localStorage.removeItem('kq3.' + k) } catch {} }); location.hash = ''; location.reload() } }
})
document.addEventListener('keydown', (e) => { const dz = e.target.closest?.('[data-drawer]'); if (dz && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); dz.click() } })

let tt = 0
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true }, 2400) }
render()
</script>
