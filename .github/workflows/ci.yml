name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanqaroo
          POSTGRES_PASSWORD: kanqaroo
          POSTGRES_DB: kanqaroo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kanqaroo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kanqaroo:kanqaroo@localhost:5432/kanqaroo_test
      E2E_DATABASE_URL: postgres://kanqaroo:kanqaroo@localhost:5432/kanqaroo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - name: Migrate test databases
        run: |
          PGPASSWORD=kanqaroo psql -h localhost -U kanqaroo -d kanqaroo_test -c "create database kanqaroo_e2e"
          DATABASE_URL=$TEST_DATABASE_URL npm run db:migrate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
